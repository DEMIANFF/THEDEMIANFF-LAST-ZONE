name: Unreal foundation static checks
on:
  push:
    branches: [unreal-foundation]
    paths:
      - 'unreal/**'
      - '.github/workflows/unreal-foundation-checks.yml'
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Unreal source foundation
        run: python unreal/tools/validate_foundation.py
