          java=Path('app/src/main/java/com/thedemianff/lastzone/MainActivity.java').read_text(encoding='utf-8')
          for token in ('v443Native.readProgress()', 'v443Native.saveProgress(snapshot)', 'v443Native.saveGuestId(guestId)', 'localStorage.setItem(V18_STORAGE,snapshot)'):
              assert token in h, 'Autoguardado HTML incompleto: '+token
          for token in ('class GuestStorageBridge','SharedPreferences','THEDEMIANFFGuestStore','readProgress()','saveProgress(String json)'):
              assert token in java, 'Autoguardado Android incompleto: '+token
          print('V44.3.2 autosave source checks passed')
          PY
