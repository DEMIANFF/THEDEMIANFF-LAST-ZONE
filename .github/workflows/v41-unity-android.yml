name: V41 Unity Native Android APK

on:
  workflow_dispatch:

jobs:
  unity-android:
    name: Unity 6 native Android build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout V41
        uses: actions/checkout@v4

      # Unity Personal via GameCI needs a legitimately activated .ulf license file.
      # Keep this workflow manual until UNITY_LICENSE has been configured.
      - name: Verify Unity credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Unity Personal/GameCI requires an activated UNITY_LICENSE (.ulf) GitHub Actions secret. Credentials alone do not replace Personal activation. See V41-Native/BUILD_FROM_PHONE.md."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: V41-Native/Library
          key: v41-unity-library-${{ runner.os }}-${{ hashFiles('V41-Native/Packages/manifest.json', 'V41-Native/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            v41-unity-library-${{ runner.os }}-

      - name: Build native Android APK using Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: V41-Native
          unityVersion: 6000.0.60f1
          targetPlatform: Android
          buildMethod: TheDemianFF.Native.Editor.V41ProjectTools.BuildAndroid
          versioning: None
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: Upload native Unity APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: THEDEMIANFF-V41-UNITY-NATIVE-APK
          path: V41-Native/Builds/*.apk
          if-no-files-found: error
          retention-days: 14
