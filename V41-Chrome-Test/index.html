<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LAST ZONE Chrome 3D</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;overflow:hidden;background:#153043;color:white;font-family:system-ui}#hud{position:fixed;top:8px;left:10px;text-shadow:0 2px 3px black;font-size:13px;pointer-events:none}#cross{position:fixed;top:48%;left:50%;font-size:26px;pointer-events:none}button{position:fixed;border:2px solid #aef;border-radius:50%;color:white;background:#28748d99;font-weight:bold;width:70px;height:70px}#fire{right:4%;bottom:10%;width:90px;height:90px}#ads{right:28%;bottom:12%}#jump{right:5%;bottom:42%}#reload{right:28%;bottom:42%}#joy{position:fixed;left:5%;bottom:10%;width:115px;height:115px;border:2px solid #fff9;border-radius:50%;pointer-events:none}#knob{position:absolute;left:37px;top:37px;width:40px;height:40px;border-radius:50%;background:#8ef9}#debug{position:fixed;left:10px;bottom:4px;font-size:12px;background:#071d2cb8;padding:5px 8px;border-radius:8px;pointer-events:none;z-index:5}button.active{background:#22a5a6dd;border-color:#fff}#error{position:fixed;top:30%;padding:25px;background:#14202a;display:none}</style></head><body><div id="hud"><b>THEDEMIANFF LAST ZONE — CHROME 3D</b><br>Prueba independiente • Lila provisional<br><span id="stats">Cargando...</span></div><div id="cross">+</div><div id="joy"><div id="knob"></div></div><button id="fire">FIRE</button><button id="ads">ADS</button><button id="jump">JUMP</button><button id="reload">RELOAD</button><div id="debug">Toca FIRE, ADS, JUMP o RELOAD para comprobar los botones.</div><div id="error"></div><script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script><script>
(()=>{if(!window.THREE){let e=document.getElementById('error');e.style.display='block';e.textContent='Se necesita conexión a internet para cargar Three.js. Conecta Wi-Fi/datos y recarga.';return;}
let r;try{r=new THREE.WebGLRenderer({antialias:false});}catch(e){document.getElementById('error').textContent=e.message;document.getElementById('error').style.display='block';return;}r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(r.domElement);
const debug=document.getElementById('debug');let notice='Listo',noticeUntil=0,shotCount=0,jumpCount=0,reloadCount=0;function signal(msg){notice=msg;noticeUntil=performance.now()+1800;debug.textContent=msg;}const s=new THREE.Scene();s.background=new THREE.Color(0x8fbccc);s.fog=new THREE.Fog(0x8fbccc,55,130);const c=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,180);s.add(new THREE.HemisphereLight(0xffffff,0x688a9b,2.5));let sun=new THREE.DirectionalLight(0xffe9c5,2);sun.position.set(-20,30,10);s.add(sun);
const mat=x=>new THREE.MeshLambertMaterial({color:x}),snow=mat(0xe2f2f5),steel=mat(0x3b6077),ice=mat(0x66bfd6),gold=mat(0xffad52),purple=mat(0x704cb2),solid=[],targets=[];
function box(x,y,z,w,h,d,m,collide=false){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);s.add(o);if(collide)solid.push({x,z,w,d});return o}
box(0,-.5,0,160,1,160,snow);
for(let i=0;i<8;i++){let x=-35+i%4*24,z=-25+Math.floor(i/4)*42;box(x,3,z,10,6,10,steel,true);box(x,6.2,z,11,.5,11,ice);box(x,3.4,z+5.1,2,2,.1,ice)}
for(let i=0;i<12;i++){let x=-42+i%6*17,z=18+Math.floor(i/6)*16;targets.push({o:box(x,1.15,z,1.1,2.3,.8,gold),hp:100})}
for(let i=0;i<24;i++){let x=Math.sin(i*8.3)*66,z=Math.cos(i*5.7)*63;let o=new THREE.Mesh(new THREE.IcosahedronGeometry(1+i%3*.4,0),ice);o.position.set(x,.9,z);s.add(o)}
const lila=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.4,1,4,8),purple),head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),gold);body.position.y=1.2;head.position.y=2.1;lila.add(body,head);s.add(lila);
let x=0,z=0,y=0,vy=0,yaw=0,pitch=.12,ammo=30,reserve=180,kills=0,last=0,fps=0,frames=0,elapsed=0;let move=null,look=null,fire=null,ads=null;const fingers=new Map(),knob=document.getElementById('knob'),joy=document.getElementById('joy'),ray=new THREE.Raycaster(),clock=new THREE.Clock();
function btn(px,py){for(let id of ['fire','ads','jump','reload']){let q=document.getElementById(id).getBoundingClientRect();if(px>=q.left&&px<=q.right&&py>=q.top&&py<=q.bottom)return id}return null}
function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();let id=e.pointerId,b=btn(e.clientX,e.clientY);fingers.set(id,{x:e.clientX,y:e.clientY});try{e.target.setPointerCapture(id)}catch(_){}
if(b==='fire'&&fire===null){fire=id;signal('FIRE: pulsado');}
else if(b==='ads'&&ads===null){ads=id;signal('ADS: activado');}
else if(b==='jump'){if(y<=.001){vy=6.5;jumpCount++;signal('SALTO: '+jumpCount);}else signal('SALTO: en el aire');}
else if(b==='reload'){let n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;if(n>0)reloadCount++;signal(n>0?'RECARGA: +'+n+' balas':'RECARGA: cargador lleno o sin reserva');}
else if(!b&&e.clientX<innerWidth*.4&&move===null){move=id;signal('JOYSTICK: activo');}
else if(!b&&look===null){look=id;signal('CAMARA: desliza para girar');}}
function drag(e){let f=fingers.get(e.pointerId);if(!f)return;e.preventDefault();if(e.pointerId===look){let dx=e.clientX-f.x,dy=e.clientY-f.y;yaw-=dx*.005;pitch=Math.max(-.65,Math.min(.85,pitch+dy*.004));if(Math.abs(dx)+Math.abs(dy)>1)signal('CAMARA: movimiento detectado');}f.x=e.clientX;f.y=e.clientY;}
function release(e){fingers.delete(e.pointerId);if(e.pointerId===move)move=null;if(e.pointerId===look)look=null;if(e.pointerId===fire)fire=null;if(e.pointerId===ads){ads=null;signal('ADS: desactivado');}}
addEventListener('pointerdown',down,{passive:false});addEventListener('pointermove',drag,{passive:false});addEventListener('pointerup',release);addEventListener('pointercancel',release);addEventListener('blur',()=>{fingers.clear();move=look=fire=ads=null;signal('Controles reiniciados');});document.addEventListener('contextmenu',e=>e.preventDefault());
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);elapsed+=dt;frames++;if(elapsed>.8){fps=Math.round(frames/elapsed);elapsed=0;frames=0}let mx=0,my=0,f=fingers.get(move);if(f){let q=joy.getBoundingClientRect();mx=Math.max(-1,Math.min(1,(f.x-q.left-q.width/2)/45));my=Math.max(-1,Math.min(1,(f.y-q.top-q.height/2)/45));knob.style.transform='translate('+mx*32+'px,'+my*32+'px)'}else knob.style.transform='';let speed=Math.hypot(mx,my)>.9&&ads===null&&fire===null?8.5:6.2,dx=(mx*Math.cos(yaw)+my*Math.sin(yaw))*speed*dt,dz=(mx*Math.sin(yaw)-my*Math.cos(yaw))*speed*dt;
const free=(a,b)=>!solid.some(o=>Math.abs(a-o.x)<o.w/2+.45&&Math.abs(b-o.z)<o.d/2+.45);if(free(x+dx,z))x+=dx;if(free(x,z+dz))z+=dz;x=Math.max(-78,Math.min(78,x));z=Math.max(-78,Math.min(78,z));if(y>0||vy>0){vy-=20*dt;y=Math.max(0,y+vy*dt);if(y===0)vy=0}lila.position.set(x,y,z);lila.rotation.y=yaw;
let direction=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)),eye=new THREE.Vector3(x,y+1.8,z);c.position.lerp(eye.clone().addScaledVector(direction,ads!==null?-2.2:-4.6).add(new THREE.Vector3(.6,.5,0)),1-Math.exp(-16*dt));c.lookAt(eye.clone().addScaledVector(direction,15));c.fov+=((ads!==null?49:67)-c.fov)*(1-Math.exp(-12*dt));c.updateProjectionMatrix();
if(fire!==null&&performance.now()-last>110&&ammo>0){last=performance.now();ammo--;shotCount++;if(shotCount===1||shotCount%5===0)signal('DISPARO: '+shotCount+' | balas '+ammo);ray.set(c.position,c.getWorldDirection(new THREE.Vector3()));let hits=ray.intersectObjects(targets.map(t=>t.o));if(hits.length){let t=targets.find(t=>t.o===hits[0].object);if(t){t.hp-=23;if(t.hp<=0){s.remove(t.o);targets.splice(targets.indexOf(t),1);kills++}}}}
document.getElementById('stats').textContent='FPS '+fps+' | Munición '+ammo+'/'+reserve+' | Bajas '+kills+' | Blancos '+targets.length+' | ADS '+(ads!==null?'ON':'OFF')+' | Saltos '+jumpCount+' | Disparos '+shotCount;for(const [name,id] of [['fire',fire],['ads',ads]])document.getElementById(name).classList.toggle('active',id!==null);if(performance.now()>noticeUntil)debug.textContent='CAMARA: '+yaw.toFixed(2)+' / '+pitch.toFixed(2)+' | ADS '+(ads!==null?'ON':'OFF')+' | SALTOS '+jumpCount+' | RECARGAS '+reloadCount;r.render(s,c)}loop();addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix()});
})();</script></body></html>
