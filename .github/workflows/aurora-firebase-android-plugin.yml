name: Aurora Firebase Android v2 plugin isolated build

on:
  push:
    branches:
      - codex/v75-75-android-firebase-native-plugin-vulkan
      - codex/v75-76-motorola-firebase-gradle-integration-vulkan
      - codex/v75-77-lobby-account-ux-firebase-native
      - codex/v75-78-aurora-full-lobby-login-navigation
    paths:
      - 'firebase-godot-bridge/**'
      - '.github/workflows/aurora-firebase-android-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-firebase-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-native-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 36 build platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile actual Firebase SDK / Godot plugin AARs
        run: gradle -p firebase-godot-bridge :plugin:assembleDebug :plugin:assembleRelease --no-daemon --stacktrace
      - name: Validate native manifest and compiled plugin entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          import shutil
          outputs=Path("firebase-godot-bridge/plugin/build/outputs/aar")
          addon=Path("firebase-godot-bridge/out/AuroraFirebase")
          shutil.copytree("firebase-godot-bridge/addon/AuroraFirebase",addon)
          for variant in ("debug","release"):
              p=outputs/("plugin-"+variant+".aar")
              assert p.is_file() and p.stat().st_size > 1000, "No Android library produced: "+variant
              with ZipFile(p) as aar:
                  manifest=aar.read("AndroidManifest.xml")
                  assert manifest, "Missing compiled AndroidManifest.xml"
                  with ZipFile(BytesIO(aar.read("classes.jar"))) as classes:
                      found=[z for z in classes.namelist() if z.endswith("AuroraFirebasePlugin.class")]
                      assert len(found)==1, "Missing Godot v2 initializer: "+repr(found)
              target=addon/"bin"/variant/("AuroraFirebase-"+variant+".aar")
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,target)
              print("AURORA_FIREBASE_PLUGIN_AAR_PASS",variant,p.stat().st_size)
          print("AURORA_GODOT_V2_ADDON_PACKAGE_PASS",
                sorted(str(p.relative_to(addon)) for p in addon.rglob("*") if p.is_file()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-FIREBASE-V75.75-GODOT-V2-ADDON-NOT_IN_GAME
          path: firebase-godot-bridge/out/AuroraFirebase/
          retention-days: 14
