      # A second, isolated Godot Gradle build packages the actual Firebase
      # plugin. It is deliberately not the normal signed Vulkan preview.
      # Without an EXACT Godot Android registration it is diagnostics-only.
      - uses: gradle/actions/setup-gradle@v5
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          gradle-version: '8.13'
      - name: Compile matching Godot 4.7.2 Firebase SDK bridge AARs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: gradle -p firebase-godot-bridge :plugin:assembleDebug :plugin:assembleRelease --no-daemon
      - name: Install separate Firebase Android Gradle template and addon
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          python3 native-godot/tools/prepare_firebase_gradle_trial.py stage
          # Godot's editor template-installer UI needs Android device discovery,
          # which is unavailable in headless CI; directly install the pinned
          # android_source.zip shipped with the SAME Godot 4.7.2 template.
          TEMPLATE="$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip"
          test -s "$TEMPLATE"
          mkdir -p native-godot/android/build
          unzip -q "$TEMPLATE" -d native-godot/android/build
          test -s native-godot/android/build/build.gradle
          test -s native-godot/android/build/gradlew
          # Godot 4.7.2's official template installer also writes these two
          # metadata files in res://android; merely unzipping is insufficient.
          echo 4.7.2.stable > native-godot/android/.build_version
          touch native-godot/android/build/.gdignore
          grep -Fx '4.7.2.stable' native-godot/android/.build_version
          echo AURORA_GODOT_472_GRADLE_TEMPLATE_PASS
      - name: Configure isolated Firebase test host (no production writes)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          AURORA_NATIVE_GOOGLE_SERVICES_B64: ${{ secrets.AURORA_NATIVE_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${AURORA_NATIVE_GOOGLE_SERVICES_B64:-}" ]; then
            printf '%s' "$AURORA_NATIVE_GOOGLE_SERVICES_B64" | base64 --decode > /tmp/aurora-native-gs.json
            python3 native-godot/tools/prepare_firebase_gradle_trial.py configure --firebase-json /tmp/aurora-native-gs.json
            rm -f /tmp/aurora-native-gs.json
          else
            python3 native-godot/tools/prepare_firebase_gradle_trial.py configure
          fi
          godot --headless --path native-godot --editor --quit
      - name: Export dedicated Motorola Firebase Gradle diagnostic APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          APK="native-godot/out/THEDEMIAN-V75.125-MOTOROLA-FIREBASE-GRADLE.apk"
          LOG="native-godot/out/firebase-gradle-export.log"
          # Headless Godot 4.7.2 may emit an ADB daemon error at shutdown.
          # Preserve its exit code and export diagnostics; do not assume either
          # a completed progress bar or this ADB message means success.
          set +e
          godot --headless --path native-godot --export-debug "Android Preview" out/THEDEMIAN-V75.125-MOTOROLA-FIREBASE-GRADLE.apk > "$LOG" 2>&1
          GODOT_EXIT=$?
          set -e
          tail -n 65 "$LOG"
          if [ ! -s "$APK" ]; then
            echo "::error::Godot exit $GODOT_EXIT and no Gradle APK exists. Inspect the captured Gradle export log."
            exit 1
          fi
          # An output file alone is not enough: the archive must be complete,
          # contain the Godot engine and exported project, and pass every
          # signature, ABI, plugin and alignment validation below.
          python3 - "$APK" <<'PY'
          import sys,zipfile
          from pathlib import Path
          apk=Path(sys.argv[1])
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              assert "AndroidManifest.xml" in names, "Missing Android manifest"
              assert "assets/project.binary" in names, "Missing Godot game assets"
              assert any(s.startswith("lib/arm64-v8a/") and s.endswith(".so") for s in names), "Missing 64-bit game engine"
              assert z.testzip() is None, "APK archive failed CRC"
          print("AURORA_GRADLE_ARCHIVE_COMPLETE",apk.stat().st_size)
          PY
          if [ "$GODOT_EXIT" -ne 0 ]; then
            echo "::warning::Godot returned $GODOT_EXIT despite producing an intact APK; requiring all independent Android verification gates."
          fi
          # Godot/Gradle debug signing may omit APK signature scheme v3 even
          # with the correct certificate. Re-sign the already aligned Gradle
          # output using the PINNED existing preview certificate (no new key).
          # apksigner defaulted to APK v3 ONLY because Gradle selected an
          # Android 9+ min SDK. Force signature coverage from API 24 when
          # signing, which includes both v2 and v3 without changing the
          # manifest's actual Android minSdkVersion. Require both gates.
          SIGNER="$ANDROID_HOME/build-tools/35.0.1/apksigner"
          "$SIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --min-sdk-version 24 \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "${APK%.apk}.resigned.apk" "$APK"
          mv "${APK%.apk}.resigned.apk" "$APK"
          # Verify with the manifest's real minSdk AND with API24 to
          # actively exercise both the v2 (API24-27) and v3 (API28+)
          # cryptographic signing blocks. Neither check is skipped.
          "$SIGNER" verify --verbose --print-certs "$APK" > native-godot/out/firebase-gradle-signer-manifest.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' native-godot/out/firebase-gradle-signer-manifest.txt
          "$SIGNER" verify --min-sdk-version 24 --verbose --print-certs "$APK" > native-godot/out/firebase-gradle-signer-check.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' native-godot/out/firebase-gradle-signer-check.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' native-godot/out/firebase-gradle-signer-check.txt
          python3 native-godot/tools/verify_android_apk.py "$APK" --build-tools "$ANDROID_HOME/build-tools/35.0.1" --logs native-godot/out/firebase-gradle-verification --verify-min-sdk 24
          expected="$(cat native-godot/out/preview-signer-sha256.txt)"
          grep -F "Signer #1 certificate SHA-256 digest: $expected" native-godot/out/firebase-gradle-verification/signature.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk=Path('native-godot/out/THEDEMIAN-V75.125-MOTOROLA-FIREBASE-GRADLE.apk')
          with zipfile.ZipFile(apk) as archive:
              dex=[z for z in archive.namelist() if z.startswith('classes') and z.endswith('.dex')]
              assert dex, 'No Android DEX compiled'
              assert any(b'AuroraFirebasePlugin' in archive.read(z) for z in dex), 'The native Firebase plugin is NOT installed in the APK'
          print('AURORA_FIREBASE_INSTALLED_APK_PASS package=preview plugin=classes.dex')
          PY
          sha256sum "$APK" > native-godot/out/FIREBASE-GRADLE-SHA256SUMS.txt
          { echo 'V75.105 Motorola Firebase Gradle integration; login requires matching Firebase app + App Check'; git rev-parse HEAD; } > native-godot/out/FIREBASE-GRADLE-BUILD.txt
      - uses: actions/upload-artifact@v6
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: THEDEMIAN-V75.125-MOTOROLA-FIREBASE-GRADLE-DIAGNOSTIC
          path: |
            native-godot/out/THEDEMIAN-V75.125-MOTOROLA-FIREBASE-GRADLE.apk
            native-godot/out/FIREBASE-GRADLE-SHA256SUMS.txt
            native-godot/out/FIREBASE-GRADLE-BUILD.txt
            native-godot/out/firebase-gradle-verification/
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: V75125-FAILED-VALIDATION-LOGS
          path: |
            native-godot/out/qa/
            native-godot/out/qa-exported-vulkan/
            native-godot/out/vulkan-verification/
            native-godot/out/firebase-gradle-export.log
            native-godot/out/firebase-gradle-signer-check.txt
            native-godot/out/firebase-gradle-signer-manifest.txt
            native-godot/out/firebase-gradle-verification/
          retention-days: 14
