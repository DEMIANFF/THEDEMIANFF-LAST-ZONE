name: Compilar APK offline THEDEMIANFF

on:
  workflow_dispatch:
  push:
    branches: [main, v28-html-upgrade]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar dependencias 3D para APK offline
        run: |
          set -euo pipefail
          ASSETS=app/src/main/assets
          mkdir -p "$ASSETS"
          if grep -q 'src="three.min.js"' "$ASSETS/index.html"; then
            curl --fail --location --retry 3 --silent --show-error "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" -o "$ASSETS/three.min.js"
          fi
          if grep -q 'src="GLTFLoader.js"' "$ASSETS/index.html"; then
            curl --fail --location --retry 3 --silent --show-error "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js" -o "$ASSETS/GLTFLoader.js"
          fi
          test -s "$ASSETS/index.html"
          if grep -q 'src="three.min.js"' "$ASSETS/index.html"; then test -s "$ASSETS/three.min.js"; fi
          if grep -q 'src="GLTFLoader.js"' "$ASSETS/index.html"; then test -s "$ASSETS/GLTFLoader.js"; fi
      - name: Compilar APK debug
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: THEDEMIANFF-V28-APK-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
