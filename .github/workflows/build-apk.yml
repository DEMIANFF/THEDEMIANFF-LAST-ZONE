name: Compilar APK offline THEDEMIANFF

on:
  workflow_dispatch:
  push:
    branches: [main, v28-html-upgrade]

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.THEDEMIANFF_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar dependencias 3D para APK offline
        run: |
          set -euo pipefail
          ASSETS=app/src/main/assets
          mkdir -p "$ASSETS"
          if grep -q 'src="three.min.js"' "$ASSETS/index.html" && [ ! -s "$ASSETS/three.min.js" ]; then
            curl --fail --location --retry 3 --silent --show-error "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js" -o "$ASSETS/three.min.js"
          fi
          if grep -q 'src="GLTFLoader.js"' "$ASSETS/index.html" && [ ! -s "$ASSETS/GLTFLoader.js" ]; then
            curl --fail --location --retry 3 --silent --show-error "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js" -o "$ASSETS/GLTFLoader.js"
          fi
          # V29: aceptar la subida móvil de Lila en la raíz de assets y normalizar la ruta.
          mkdir -p "$ASSETS/models"
          if [ ! -s "$ASSETS/models/lila-operator.glb" ]; then
            for source in "$ASSETS/operador-lila.glb" "$ASSETS/lila-operator.glb" "$ASSETS/models/operador-lila.glb"; do
              if [ -s "$source" ]; then
                cp "$source" "$ASSETS/models/lila-operator.glb"
                echo "Modelo Lila encontrado en $source; ruta normalizada."
                break
              fi
            done
          fi
          test -s "$ASSETS/index.html"
          test -s "$ASSETS/models/lila-operator.glb" || { echo "::error::Falta models/lila-operator.glb: no generar APK con Lila de respaldo"; exit 1; }
          echo "Recursos 3D presentes:"
          ls -lh "$ASSETS/index.html" "$ASSETS/three.min.js" "$ASSETS/GLTFLoader.js" "$ASSETS/models/lila-operator.glb"
          if grep -q 'src="three.min.js"' "$ASSETS/index.html"; then test -s "$ASSETS/three.min.js"; fi
          if grep -q 'src="GLTFLoader.js"' "$ASSETS/index.html"; then test -s "$ASSETS/GLTFLoader.js"; fi
      - name: Validar scripts y estructura del modelo 3D
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,struct,json,subprocess,tempfile
          root=Path("app/src/main/assets")
          html=(root/"index.html").read_text(encoding="utf-8")
          # Evitar que el respaldo vuelva a tapar JUGAR en el lobby.
          if html.count('id="v29BackupButton"')!=1: raise SystemExit("Debe existir un único botón de respaldo")
          if 'data-tab="progress"' not in html or 'data-section="progress"' not in html: raise SystemExit("Falta la pestaña PROGRESO en configuración")
          # Validar el bloque de ajustes hasta la primera sección, no hasta el primer div cerrado.
          settings=html.split('<div id="pausePanel"',1)[1].split('<div class="settingsSection"',1)[0]
          if 'data-tab="progress"' not in settings: raise SystemExit("PROGRESO no está en las pestañas de configuración")
          if 'document.body.appendChild(btn)' in html: raise SystemExit("Regresión: botón flotante de respaldo fuera de ajustes")
          scripts=re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>",html,re.I)
          count=0
          for script in scripts:
              if not script.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8") as tmp:
                  tmp.write(script);tmp.flush()
                  subprocess.run(["node","--check",tmp.name],check=True)
                  count+=1
          if count==0: raise SystemExit("No se encontraron bloques JavaScript inline; revisar HTML")
          print(f"JavaScript HTML validado: {count} bloques")
          for name in ("three.min.js","GLTFLoader.js"):
              subprocess.run(["node","--check",str(root/name)],check=True)
          p=root/"models/lila-operator.glb"
          data=p.read_bytes()
          if len(data)<20 or data[:4]!=b"glTF": raise SystemExit("GLB inválido: falta cabecera glTF")
          magic,version,length=struct.unpack_from("<4sII",data)
          if version!=2 or length!=len(data): raise SystemExit("GLB inválido: versión o longitud")
          chunk_len,chunk_type=struct.unpack_from("<I4s",data,12)
          if chunk_type!=b"JSON": raise SystemExit("GLB inválido: bloque JSON ausente")
          doc=json.loads(data[20:20+chunk_len])
          names={node.get("name") for node in doc.get("nodes",[])}
          expected={"leftArm","rightArm","leftLeg","rightLeg"}
          missing=expected-names
          if missing: raise SystemExit("Faltan articulaciones de Lila: "+", ".join(sorted(missing)))
          if not doc.get("meshes"): raise SystemExit("GLB sin mallas")
          print(f"Lila validada: {len(doc['meshes'])} mallas y {len(doc.get('nodes',[]))} nodos")
          PY
      - name: Compilar APK debug
        run: gradle --no-daemon assembleDebug
      - name: Verificar identidad y firma de APK debug
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          echo "::notice::La APK debug puede tener firma diferente en cada ejecución de GitHub Actions; no desinstalar una instalación existente sin respaldo."
      - name: Informar estado de firma permanente
        if: env.HAS_RELEASE_KEY != 'true'
        run: echo "::warning::No hay keystore de release configurado. La APK debug no garantiza actualizaciones compatibles con la instalación anterior."
      - name: Mostrar identidad y certificado de APK debug
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
          sha256sum "$APK"
      - name: Compilar APK release con firma permanente
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.THEDEMIANFF_KEYSTORE_BASE64 }}
          THEDEMIANFF_KEYSTORE_PASSWORD: ${{ secrets.THEDEMIANFF_KEYSTORE_PASSWORD }}
          THEDEMIANFF_KEY_ALIAS: ${{ secrets.THEDEMIANFF_KEY_ALIAS }}
          THEDEMIANFF_KEY_PASSWORD: ${{ secrets.THEDEMIANFF_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$THEDEMIANFF_KEYSTORE_PASSWORD"
          test -n "$THEDEMIANFF_KEY_ALIAS"
          test -n "$THEDEMIANFF_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thedemianff-release.jks"
          export THEDEMIANFF_KEYSTORE_PATH="$RUNNER_TEMP/thedemianff-release.jks"
          gradle --no-daemon assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Mostrar identidad y firma de APK release
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY == 'true'
        with:
          name: THEDEMIANFF-V32-APK-RELEASE-FIRMA-PERMANENTE
          path: app/build/outputs/apk/release/app-release.apk
      - name: Aviso de compatibilidad de actualizaciones
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            echo "::notice::Usa EXCLUSIVAMENTE app-release.apk para las próximas actualizaciones. Conserva el mismo keystore y aumenta versionCode."
          else
            echo "::warning::Solo se ha generado una APK de prueba con firma temporal. No sirve para actualizar instalaciones anteriores; NO desinstales una app con progreso sin exportarlo."
          fi
      - uses: actions/upload-artifact@v4
        if: env.HAS_RELEASE_KEY != 'true'
        with:
          name: THEDEMIANFF-PRUEBA-NO-ACTUALIZABLE-FIRMA-TEMPORAL
          path: app/build/outputs/apk/debug/app-debug.apk
