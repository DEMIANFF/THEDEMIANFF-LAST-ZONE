name: Aurora V75.64 Vulkan Mobile only signed ARM64
concurrency:
  group: aurora-android-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [codex/v72-native-visual-slice, codex/v73-native-quality-combat, codex/v73-1-motorola-fixes, codex/v73-2-tps-fire-drag, codex/v74-aurora-offline-royale, codex/v74-1-weapons-ik-awm, codex/v75-br-flow-animations, codex/v75-1-real-match-progression, codex/v75-2-motorola-recovery, codex/v75-3-battle-royale-improvements, codex/v75-4-aim-animation-recovery, codex/v75-5-aurora-lobby-combat-ui, codex/v75-6-puerto-aurora-3d-district, codex/v75-7-terrain-camera-audio-repair, codex/v75-11-aurora-gait-coastal-detail, codex/v75-11-landing-stability-fix, codex/v75-12-per-scope-mobile-settings, codex/v75-13-aurora-deployable-cover, codex/v75-14-mobile-freefall-crash-recovery, codex/v75-15-aircraft-jump-transition-isolation, codex/v75-16-aircraft-startup-isolation, codex/v75-17-mobile-freefall-terrain-protection, codex/v75-18-parachute-transition-isolation, codex/v75-19-prewarmed-canopy-native-trace, codex/godot-canopy-physics-audit, codex/godot-flight-blackbox-diagnostics, codex/godot-shared-scene-crash-audit, codex/v75-20-training-freefall-crash-isolation, codex/v75-21-mobile-physics-animation-hardening, codex/v75-22-motorola-crash-window-recovery, codex/v75-23-android-audio-thread-recovery, codex/v75-24-wav-loop-buffer-safety, codex/v75-25-120hz-stable-preview-signing, codex/v75-26-camera-controls-motion-polish, codex/v75-27-lobby-hud-editor, codex/v75-28-puerto-aurora-sector-expansion, codex/v75-29-zone-bot-sync-house-qa, codex/v75-30-combat-sound-awareness, codex/v75-34-integrated-combat-inventory-aurora, codex/v75-40-residential-terrain-foundations, codex/v75-41-house-hud-settings-integration, codex/v75-42-aurora-tactical-map-aircraft-brand, codex/v75-43-map-lobby-brand-awm-polish, codex/v75-44-aurora-playable-scale-visual-core, codex/v75-45-mobile-render-pipeline-budget, codex/v75-46-vulkan-mobile-ab-test, codex/v75-47-vulkan-frame-pacing-optimizations, codex/v75-48-vulkan-only-real-battle-loot, codex/v75-49-tactical-healing-vulkan, codex/v75-50-tactical-ai-combat-vulkan, codex/v75-55-unified-battle-royale-integration-vulkan, codex/v75-56-combat-feedback-quality-vulkan, codex/v75-57-ten-minute-match-ledger-vulkan, codex/v75-58-physical-headshots-vulkan, codex/v75-59-lila-aurora-rig-identity-vulkan, codex/v75-60-lila-hair-weapon-holsters-vulkan, codex/v75-61-lila-motion-precision-vulkan, codex/v75-62-tactical-bot-medicine-vulkan, codex/v75-63-lila-3d-medkit-animation-vulkan, codex/v75-64-physical-opponent-inventory-loot-vulkan]
    paths:
      - 'native-godot/**'
      - '.github/workflows/native-godot-preview-apk.yml'
      - '.github/qa-signing/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CC0 female operator source (pinned and verified)
        run: bash native-godot/tools/fetch_operator.sh /tmp/aurora-operator
      - name: Install Blender FBX importer / GLB exporter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy > /tmp/aurora-blender-install.log
          blender --background --version | head -n 2
      - name: Generate real skinned female operator from verified CC0 source
        run: |
          blender -b --python native-godot/tools/convert_operator.py -- \
            /tmp/aurora-operator/attractor_mechanic_tpose.fbx \
            /tmp/aurora-operator/attractor_mechanic_tpose.png \
            native-godot/assets/characters/aurora_operator.glb
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          f=Path('native-godot/assets/characters/aurora_operator.glb')
          data=f.read_bytes()
          magic,ver,total=struct.unpack_from('<III',data)
          assert magic==0x46546c67 and ver==2 and total==len(data)
          chunk_length,chunk_type=struct.unpack_from('<II',data,12)
          assert chunk_type==0x4e4f534a
          scene=json.loads(data[20:20+chunk_length])
          print('Skinned GLB:',f.stat().st_size,'bytes',len(scene.get('skins',[])),'skins',len(scene.get('animations',[])),'clips',len(scene.get('meshes',[])),'meshes')
          assert len(scene.get('skins',[]))>=1,'Rigged character has no skin'
          assert len(scene.get('animations',[]))>=1,'Character has no animation clips'
          kit_meshes=[m for m in scene.get('meshes',[])
                      if 'LilaAuroraSignature' in m.get('name','')]
          kit_nodes=[n for n in scene.get('nodes',[])
                     if n.get('name')=='LilaAuroraSignatureKit']
          kit_mats=[m for m in scene.get('materials',[])
                    if m.get('name','').startswith('LilaAurora') and
                       not m.get('name','').startswith('LilaAuroraHair')]
          assert len(kit_meshes)==1,'Lila original tactical kit is absent'
          assert len(kit_nodes)==1 and 'skin' in kit_nodes[0],\
              'Lila kit is not weighted to original humanoid skeleton'
          assert len(kit_mats)==3,'Lila signature needs three shared PBR materials'
          kit_vertices=sum(scene['accessors'][p['attributes']['POSITION']]['count']
                           for p in kit_meshes[0]['primitives'])
          assert 152<=kit_vertices<=1500, 'Lila original kit geometry too large or missing'
          hair_meshes=[m for m in scene.get('meshes',[])
                       if 'LilaAuroraHairSculpt' in m.get('name','')]
          hair_nodes=[n for n in scene.get('nodes',[])
                      if n.get('name')=='LilaAuroraOriginalHair']
          hair_mats=[m for m in scene.get('materials',[])
                     if m.get('name','').startswith('LilaAuroraHair')]
          assert len(hair_meshes)==1, 'Original Lila curved hair mesh was not exported'
          assert len(hair_nodes)==1 and 'skin' in hair_nodes[0], \
              'Lila hairstyle is not weighted to the humanoid armature'
          assert len(hair_mats)==3,'Lila sculpted hair needs 3 original PBR materials'
          hair_vertices=sum(scene['accessors'][p['attributes']['POSITION']]['count']
                            for p in hair_meshes[0]['primitives'])
          assert 1200<=hair_vertices<=12000, 'Lila mobile hair vertex budget violated'
          print('LILA_SIGNATURE_GLTF_PASS',len(kit_nodes),'skinned armor,',
                kit_vertices,'vertices,',len(kit_mats),'materials')
          print('LILA_HAIR_GLTF_PASS',len(hair_nodes),'skinned hairstyle,',
                hair_vertices,'vertices,',len(hair_mats),'materials')
          PY
      - name: Build original AWM GLB from authored Blender mesh
        run: |
          blender --background --python native-godot/tools/build_awm.py -- native-godot/assets/weapons/aurora_awm.glb
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          p=Path('native-godot/assets/weapons/aurora_awm.glb')
          blob=p.read_bytes()
          magic,version,length=struct.unpack_from('<III',blob)
          assert (magic,version,length)==(0x46546c67,2,len(blob))
          n,t=struct.unpack_from('<II',blob,12)
          assert t==0x4e4f534a
          payload=json.loads(blob[20:20+n])
          print('ORIGINAL_AWM_MESH',len(payload.get('meshes',[])),'GLB_BYTES',p.stat().st_size)
          assert len(payload.get('meshes',[]))>=32, 'AWM missing real modelling detail'
          PY
      - name: Install Godot 4.7.2 editor
        run: |
          curl -fL --retry 3 --retry-delay 3 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/aurora-godot.zip
          unzip -q /tmp/aurora-godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version
      - name: Install matching Godot Android export templates
        run: |
          curl -fL --retry 3 --retry-delay 4 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz' -o /tmp/aurora-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -jo /tmp/aurora-templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          echo 4.7.2.stable > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          rm /tmp/aurora-templates.tpz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform and SDK build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "platform-tools" >/dev/null
      - name: Configure Godot Android SDK (never regenerate preview signing key)
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import 3D models and parse project
        run: godot --headless --path native-godot --editor --quit
      - name: Run complete native QA and Motorola regressions
        run: bash native-godot/tools/run_qa.sh
      - name: Capture actual Godot scene with software OpenGL
        continue-on-error: false
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/tmp/aurora-xvfb.log
          mkdir -p native-godot/out
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_preview.gd
          test -s native-godot/out/aurora-native-v75-19-preview.png
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_frontend_preview.gd
          test -s native-godot/out/aurora-v75-19-welcome.png
          test -s native-godot/out/aurora-v75-19-lobby.png
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_coastal_preview.gd
          test -s native-godot/out/aurora-v75-19-coastal-quarter.png
          test -s native-godot/out/aurora-v75-19-coastal-street.png
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_weapon_preview.gd
          test -s native-godot/out/aurora-v74-1-ak74.png
          test -s native-godot/out/aurora-v74-1-awm.png
      - name: Render expanded Motorola layout and verify absence of side bars
        run: xvfb-run -a -s "-screen 0 2712x1220x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_responsive_preview.gd > native-godot/out/qa/responsive-render.log 2>&1
      - name: Render real first animated canopy in desktop OpenGL compatibility
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_canopy_render_qa.gd > native-godot/out/qa/canopy-render.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:' native-godot/out/qa/canopy-render.log; then exit 1; fi
          grep -F 'CANOPY_OPENGL_RENDER PASS' native-godot/out/qa/canopy-render.log
          test -s native-godot/out/audit-first-canopy-opengl.png
      - name: Configure permanent signed preview identity
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.AURORA_PREVIEW_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_KEYSTORE_B64:-}" ]; then
            echo "::error::Missing AURORA_PREVIEW_KEYSTORE_B64. Configure this GitHub Actions repository secret. Never regenerate a signing key for the same preview package."
            exit 1
          fi
          # The private key is NEVER committed to the public repository.
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          expected="60390683c689ea7376dba5392450929e30044589189c9a200d4db54806f4a653"
          actual="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The keystore certificate differs from pinned V75.64 preview identity. Refusing to produce APKs that cannot update."
            exit 1
          fi
          # Godot otherwise falls back to its own transient Android debug key.
          python3 - <<'PY'
          from pathlib import Path
          preset=Path("native-godot/export_presets.cfg")
          raw=preset.read_text()
          for needle in ['keystore/debug=""','keystore/debug_user=""','keystore/debug_password=""']:
              assert raw.count(needle)==1, f'Export setting absent: {needle}'
          raw=raw.replace('keystore/debug=""',
              'keystore/debug="'+str(Path.home()/'.android/debug.keystore')+'"')
          raw=raw.replace('keystore/debug_user=""',
              'keystore/debug_user="androiddebugkey"')
          raw=raw.replace('keystore/debug_password=""',
              'keystore/debug_password="android"')
          preset.write_text(raw)
          PY
          printf '%s\n' "$actual" > native-godot/out/preview-signer-sha256.txt
          echo "Pinned non-production preview certificate: $actual"

      # One production-directed Android preview: Mobile/Vulkan ONLY.
      # Desktop headless QA may use OpenGL to run on CI; no OpenGL APK built.
      - name: Export signed Vulkan Mobile APK (single release)
        run: |
          set -euo pipefail
          if grep -E "SCRIPT ERROR:|ERROR:" native-godot/out/qa/responsive-render.log; then exit 1; fi
          mkdir -p native-godot/out/vulkan-verification
          python3 native-godot/tools/configure_android_renderer.py --variant mobile
          grep -Fx 'renderer/rendering_method.mobile="mobile"' native-godot/project.godot
          grep -Fx 'rendering_device/driver.android="vulkan"' native-godot/project.godot
          grep -Fx 'version/code=54' native-godot/export_presets.cfg
          godot --headless --path native-godot --export-debug "Android Preview" out/THEDEMIAN-V75.64-MOTOROLA-VULKAN.apk
          test -s native-godot/out/THEDEMIAN-V75.64-MOTOROLA-VULKAN.apk
      - name: Verify Vulkan APK signature, ARM64 and complete exported gameplay QA
        run: |
          set -euo pipefail
          APK=native-godot/out/THEDEMIAN-V75.64-MOTOROLA-VULKAN.apk
          python3 native-godot/tools/verify_android_apk.py "$APK" --build-tools "$ANDROID_HOME/build-tools/35.0.1" --logs native-godot/out/vulkan-verification
          expected="$(cat native-godot/out/preview-signer-sha256.txt)"
          grep -F "Signer #1 certificate SHA-256 digest: $expected" native-godot/out/vulkan-verification/signature.txt
          AURORA_QA_LOGS="$PWD/native-godot/out/qa-exported-vulkan" bash native-godot/tools/run_exported_qa.sh "$APK"
          grep -F 'V7546_RENDER_AB PASS requested_mobile=mobile' native-godot/out/qa-exported-vulkan/v7546_renderer_variants_qa.log
          grep -F 'V7548_BATTLE_LOOT PASS' native-godot/out/qa-exported-vulkan/v7548_battle_loot_qa.log
          grep -F 'V7549_FIRST_AID PASS' native-godot/out/qa-exported-vulkan/v7549_tactical_first_aid_qa.log
          grep -F 'V7550_TACTICAL_AI PASS' native-godot/out/qa-exported-vulkan/v7550_tactical_ai_combat_qa.log
          grep -F 'V7555_UNIFIED PASS' native-godot/out/qa-exported-vulkan/v7555_unified_battle_royale_qa.log
          grep -F 'V7556_COMBAT_FEEDBACK PASS' native-godot/out/qa-exported-vulkan/v7556_combat_feedback_qa.log
          grep -F 'V7557_MATCH_LEDGER PASS' native-godot/out/qa-exported-vulkan/v7557_ten_minute_ledger_qa.log
          grep -F 'V7558_HEADSHOTS PASS' native-godot/out/qa-exported-vulkan/v7558_physical_headshot_qa.log
          grep -F 'V7559_LILA_RIG PASS' native-godot/out/qa-exported-vulkan/v7559_lila_rig_identity_qa.log
          grep -F 'V7560_LILA_HOLSTERS PASS' native-godot/out/qa-exported-vulkan/v7560_lila_hair_holster_qa.log
          grep -F 'V7560_LILA_ABILITY PASS' native-godot/out/qa-exported-vulkan/v7560_lila_tactical_ability_qa.log
          grep -F 'V7561_LILA_MOTION PASS' native-godot/out/qa-exported-vulkan/v7561_lila_motion_precision_qa.log
          grep -F 'V7562_BOT_MEDICINE PASS' native-godot/out/qa-exported-vulkan/v7562_bot_medicine_tactics_qa.log
          grep -F 'V7563_LILA_MEDKIT PASS' native-godot/out/qa-exported-vulkan/v7563_lila_medkit_visual_qa.log
          grep -F 'V7564_REAL_OPPONENT_LOOT PASS' native-godot/out/qa-exported-vulkan/v7564_opponent_inventory_loot_qa.log
          sha256sum "$APK" > native-godot/out/SHA256SUMS.txt
          { git rev-parse HEAD; godot --headless --version; echo 'ONE VULKAN MOBILE signed Android APK; real phone trial still required'; } > native-godot/out/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: THEDEMIAN-V75.64-MOTOROLA-VULKAN
          path: |
            native-godot/out/THEDEMIAN-V75.64-MOTOROLA-VULKAN.apk
            native-godot/out/vulkan-verification/
            native-godot/out/qa/
            native-godot/out/qa-exported-vulkan/
            native-godot/out/SHA256SUMS.txt
            native-godot/out/BUILD.txt
            native-godot/out/preview-signer-sha256.txt
            native-godot/out/aurora-v75-19-lobby.png
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: V7564-FAILED-VALIDATION-LOGS
          path: |
            native-godot/out/qa/
            native-godot/out/qa-exported-vulkan/
            native-godot/out/vulkan-verification/
          retention-days: 14
