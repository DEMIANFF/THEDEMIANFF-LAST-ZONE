name: Aurora V75.26 120Hz Permanent Preview Identity Android ARM64
concurrency:
  group: aurora-android-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [codex/v72-native-visual-slice, codex/v73-native-quality-combat, codex/v73-1-motorola-fixes, codex/v73-2-tps-fire-drag, codex/v74-aurora-offline-royale, codex/v74-1-weapons-ik-awm, codex/v75-br-flow-animations, codex/v75-1-real-match-progression, codex/v75-2-motorola-recovery, codex/v75-3-battle-royale-improvements, codex/v75-4-aim-animation-recovery, codex/v75-5-aurora-lobby-combat-ui, codex/v75-6-puerto-aurora-3d-district, codex/v75-7-terrain-camera-audio-repair, codex/v75-11-aurora-gait-coastal-detail, codex/v75-11-landing-stability-fix, codex/v75-12-per-scope-mobile-settings, codex/v75-13-aurora-deployable-cover, codex/v75-14-mobile-freefall-crash-recovery, codex/v75-15-aircraft-jump-transition-isolation, codex/v75-16-aircraft-startup-isolation, codex/v75-17-mobile-freefall-terrain-protection, codex/v75-18-parachute-transition-isolation, codex/v75-19-prewarmed-canopy-native-trace, codex/godot-canopy-physics-audit, codex/godot-flight-blackbox-diagnostics, codex/godot-shared-scene-crash-audit, codex/v75-20-training-freefall-crash-isolation, codex/v75-21-mobile-physics-animation-hardening, codex/v75-22-motorola-crash-window-recovery, codex/v75-23-android-audio-thread-recovery, codex/v75-24-wav-loop-buffer-safety, codex/v75-25-120hz-stable-preview-signing, codex/v75-26-camera-controls-motion-polish]
    paths:
      - 'native-godot/**'
      - '.github/workflows/native-godot-preview-apk.yml'
      - '.github/qa-signing/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - name: Prepare CC0 female operator source (pinned and verified)
        run: bash native-godot/tools/fetch_operator.sh /tmp/aurora-operator
      - name: Install Blender FBX importer / GLB exporter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy > /tmp/aurora-blender-install.log
          blender --background --version | head -n 2
      - name: Generate real skinned female operator from verified CC0 source
        run: |
          blender -b --python native-godot/tools/convert_operator.py -- \
            /tmp/aurora-operator/attractor_mechanic_tpose.fbx \
            /tmp/aurora-operator/attractor_mechanic_tpose.png \
            native-godot/assets/characters/aurora_operator.glb
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          f=Path('native-godot/assets/characters/aurora_operator.glb')
          data=f.read_bytes()
          magic,ver,total=struct.unpack_from('<III',data)
          assert magic==0x46546c67 and ver==2 and total==len(data)
          chunk_length,chunk_type=struct.unpack_from('<II',data,12)
          assert chunk_type==0x4e4f534a
          scene=json.loads(data[20:20+chunk_length])
          print('Skinned GLB:',f.stat().st_size,'bytes',len(scene.get('skins',[])),'skins',len(scene.get('animations',[])),'clips',len(scene.get('meshes',[])),'meshes')
          assert len(scene.get('skins',[]))>=1,'Rigged character has no skin'
          assert len(scene.get('animations',[]))>=1,'Character has no animation clips'
          PY
      - name: Build original AWM GLB from authored Blender mesh
        run: |
          blender --background --python native-godot/tools/build_awm.py -- native-godot/assets/weapons/aurora_awm.glb
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          p=Path('native-godot/assets/weapons/aurora_awm.glb')
          blob=p.read_bytes()
          magic,version,length=struct.unpack_from('<III',blob)
          assert (magic,version,length)==(0x46546c67,2,len(blob))
          n,t=struct.unpack_from('<II',blob,12)
          assert t==0x4e4f534a
          payload=json.loads(blob[20:20+n])
          print('ORIGINAL_AWM_MESH',len(payload.get('meshes',[])),'GLB_BYTES',p.stat().st_size)
          assert len(payload.get('meshes',[]))>=32, 'AWM missing real modelling detail'
          PY
      - name: Install Godot 4.7.2 editor
        run: |
          curl -fL --retry 3 --retry-delay 3 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/aurora-godot.zip
          unzip -q /tmp/aurora-godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version
      - name: Install matching Godot Android export templates
        run: |
          curl -fL --retry 3 --retry-delay 4 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz' -o /tmp/aurora-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -jo /tmp/aurora-templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          echo 4.7.2.stable > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          rm /tmp/aurora-templates.tpz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform and SDK build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "platform-tools" >/dev/null
      - name: Configure Godot Android SDK (never regenerate preview signing key)
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import 3D models and parse project
        run: godot --headless --path native-godot --editor --quit
      - name: Run complete native QA and Motorola regressions
        run: bash native-godot/tools/run_qa.sh
      - name: Capture actual Godot scene with software OpenGL
        continue-on-error: false
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/tmp/aurora-xvfb.log
          mkdir -p native-godot/out
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_preview.gd
          test -s native-godot/out/aurora-native-v75-19-preview.png
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_frontend_preview.gd
          test -s native-godot/out/aurora-v75-19-welcome.png
          test -s native-godot/out/aurora-v75-19-lobby.png
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_coastal_preview.gd
          test -s native-godot/out/aurora-v75-19-coastal-quarter.png
          test -s native-godot/out/aurora-v75-19-coastal-street.png
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_weapon_preview.gd
          test -s native-godot/out/aurora-v74-1-ak74.png
          test -s native-godot/out/aurora-v74-1-awm.png
      - name: Render expanded Motorola layout and verify absence of side bars
        run: xvfb-run -a -s "-screen 0 2712x1220x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_responsive_preview.gd > native-godot/out/qa/responsive-render.log 2>&1
      - name: Render real first animated canopy in desktop OpenGL compatibility
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_canopy_render_qa.gd > native-godot/out/qa/canopy-render.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:' native-godot/out/qa/canopy-render.log; then exit 1; fi
          grep -F 'CANOPY_OPENGL_RENDER PASS' native-godot/out/qa/canopy-render.log
          test -s native-godot/out/audit-first-canopy-opengl.png
      - name: Configure permanent signed preview identity
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.AURORA_PREVIEW_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_KEYSTORE_B64:-}" ]; then
            echo "::error::Missing AURORA_PREVIEW_KEYSTORE_B64. Configure this GitHub Actions repository secret. Never regenerate a signing key for the same preview package."
            exit 1
          fi
          # The private key is NEVER committed to the public repository.
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          expected="60390683c689ea7376dba5392450929e30044589189c9a200d4db54806f4a653"
          actual="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The keystore certificate differs from pinned V75.26 preview identity. Refusing to produce APKs that cannot update."
            exit 1
          fi
          # Godot otherwise falls back to its own transient Android debug key.
          python3 - <<'PY'
          from pathlib import Path
          preset=Path("native-godot/export_presets.cfg")
          raw=preset.read_text()
          for needle in ['keystore/debug=""','keystore/debug_user=""','keystore/debug_password=""']:
              assert raw.count(needle)==1, f'Export setting absent: {needle}'
          raw=raw.replace('keystore/debug=""',
              'keystore/debug="'+str(Path.home()/'.android/debug.keystore')+'"')
          raw=raw.replace('keystore/debug_user=""',
              'keystore/debug_user="androiddebugkey"')
          raw=raw.replace('keystore/debug_password=""',
              'keystore/debug_password="android"')
          preset.write_text(raw)
          PY
          printf '%s\n' "$actual" > native-godot/out/preview-signer-sha256.txt
          echo "Pinned non-production preview certificate: $actual"

      - name: Export distinct Android debug APK
        run: |
          if grep -E "SCRIPT ERROR:|ERROR:" native-godot/out/qa/responsive-render.log; then exit 1; fi
          mkdir -p native-godot/out
          godot --headless --path native-godot --export-debug "Android Preview" out/THEDEMIANFF-V75.26-MOTOROLA-DIAGNOSTICO.apk
          test -s native-godot/out/THEDEMIANFF-V75.26-MOTOROLA-DIAGNOSTICO.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify native-godot/out/THEDEMIANFF-V75.26-MOTOROLA-DIAGNOSTICO.apk
      - name: Verify APK namespace, checksum and package signature
        run: |
          APK=native-godot/out/THEDEMIANFF-V75.26-MOTOROLA-DIAGNOSTICO.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | head -n 3
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" | grep -F "com.thedemianff.lastzone.nativepreview"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK" | tee native-godot/out/signature.txt
          expected="$(cat native-godot/out/preview-signer-sha256.txt)"
          grep -F "Signer #1 certificate SHA-256 digest: $expected" native-godot/out/signature.txt || { echo "::error::APK signed by unexpected key"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 -v 4 "$APK" > native-godot/out/alignment.txt
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK" > native-godot/out/badging.txt
          grep -Fx "native-code: 'arm64-v8a'" native-godot/out/badging.txt
          grep -Fx "application-debuggable" native-godot/out/badging.txt
          { git rev-parse HEAD; godot --headless --version; blender --background --version | head -n 1; } > native-godot/out/BUILD.txt
          unzip -t "$APK" | tail -n 1
          sha256sum "$APK" | tee native-godot/out/SHA256SUMS.txt
          echo "::notice::This canopy physics audit saves only local offline sector results; it does NOT sync V70/Firebase. 9-participant sector, not 100 network users. Physical Android QA required."
      - name: Verify native ELF and execute QA from exported bytecode
        run: |
          python3 native-godot/tools/verify_android_apk.py native-godot/out/THEDEMIANFF-V75.26-MOTOROLA-DIAGNOSTICO.apk --build-tools "$ANDROID_HOME/build-tools/35.0.1" --logs native-godot/out
          AURORA_QA_LOGS="$PWD/native-godot/out/qa-exported" bash native-godot/tools/run_exported_qa.sh native-godot/out/THEDEMIANFF-V75.26-MOTOROLA-DIAGNOSTICO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: THEDEMIANFF-V75.26-MOTOROLA-DIAGNOSTICO-PREVIEW
          path: |
            native-godot/out/THEDEMIANFF-V75.26-MOTOROLA-DIAGNOSTICO.apk
            native-godot/out/SHA256SUMS.txt
            native-godot/out/audit-first-canopy-opengl.png
            native-godot/out/aurora-native-v75-19-preview.png
            native-godot/out/aurora-v75-19-welcome.png
            native-godot/out/aurora-v75-19-lobby.png
            native-godot/out/aurora-v75-19-coastal-quarter.png
            native-godot/out/aurora-v75-19-coastal-street.png
            native-godot/out/aurora-v74-1-ak74.png
            native-godot/out/aurora-v74-1-awm.png
            native-godot/out/v7517-motorola-*.png
            native-godot/out/qa/
            native-godot/out/qa-exported/
            native-godot/out/apk-verification.json
            native-godot/out/BUILD.txt
            native-godot/out/signature.txt
            native-godot/out/preview-signer-sha256.txt
            native-godot/out/badging.txt
            native-godot/out/alignment.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: CANOPY-AUDIT-FAILED-VALIDATION-LOGS
          path: |
            native-godot/out/qa/
            native-godot/out/qa-exported/
          retention-days: 14
