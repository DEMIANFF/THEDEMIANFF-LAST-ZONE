plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
android {
    namespace 'com.thedemianff.lastzone'
    compileSdk 35
    defaultConfig {
        applicationId 'com.thedemianff.lastzone'
        minSdk 26
        targetSdk 35
        versionCode 115
        versionName '48.2-tactical-combat'
    }
    signingConfigs {
        persistentRelease {
            def ksPath = System.getenv('THEDEMIANFF_KEYSTORE_PATH')
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('THEDEMIANFF_KEYSTORE_PASSWORD')
                keyAlias System.getenv('THEDEMIANFF_KEY_ALIAS')
                keyPassword System.getenv('THEDEMIANFF_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('THEDEMIANFF_KEYSTORE_PATH')) {
                signingConfig signingConfigs.persistentRelease
            }
        }
    }
}
tasks.register('bundleThree') {
    def destination=file('src/main/assets/three.min.js')
    inputs.property('threeVersion','0.160.1')
    outputs.file(destination)
    doLast {
        if(destination.exists() && destination.length()>100000) {
            println 'Three.js local already present; offline dependency ready.'
            return
        }
        destination.parentFile.mkdirs()
        def url='https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.1/three.min.js'
        println 'Fetching Three.js for inclusion in the APK: '+url
        try {
            new URL(url).withInputStream { stream ->
                destination.withOutputStream { out -> out << stream }
            }
        } catch(Exception e) {
            destination.delete()
            throw new GradleException('Could not bundle Three.js. Internet is required ONCE when building, or manually place version 0.160.1 three.min.js in app/src/main/assets/.',e)
        }
        if(destination.length()<100000) {
            destination.delete()
            throw new GradleException('Three.js download invalid: aborting build.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(tasks.named('bundleThree')) }

// V44.4: SDK installed only; Google login and cloud persistence are not enabled yet.
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.15.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.google.firebase:firebase-firestore'
}
