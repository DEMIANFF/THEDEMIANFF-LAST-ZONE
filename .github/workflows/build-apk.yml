name: Compilar APK offline THEDEMIANFF
# V44.2: iniciar compilacion Android de prueba tras corregir assets WebView.

on:
  workflow_dispatch:
  push:
    branches: [main, v28-html-upgrade, v34-4-ads-sprint-fix, v34-5-ads-button-fix, v34-6-combat-stop, v34-7-combat-strafe, v35-1-combat-spawn-lobby, v36-0-battle-royale-core, v36-1-events-missions-crouch, v36-2-cover-loot-events, v37-0-aurora-ux-flight-events, v37-1-lobby-hotfix, v37-2-controls-events-camera, v38-0-operations-lobby-fhd, v38-1-event-navigation-touch-camera, v38-2-ads-camera-stability-suite, v38-3-lobby-parachute-polish, v38-6-lobby-polish-flight-controls, v38-7-parachute-axis-walk-68, v38-8-flight-axes-walk-74, v38-9-camera-relative-parachute, v39-0-walk-81-stable, v39-1-combat-precision-stability, v39-2-arsenal-recoil-polish, v39-3-impact-feedback-enemy-reaction, v39-4-tactical-cover-ai, v39-5-combat-animation-polish, v39-6-puerto-aurora-expansion, v39-7-aurora-cinematic-visuals, v39-8-aircraft-drop-rework, v40-architecture-reconstruction, v42-battle-royale-evolution, v42-2-graphics-recovery, v42-3-render-stability, v42-4-render-fix, v42-5-world-polish, v44-2-android-assets-fix, v44-3-account-entry-preview, v44-3-1-backup-integrity, v44-3-2-autosave-guest, v44-4-firebase-foundation, v44-5-secure-player-profiles]

jobs:
  android:
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_KEY: ${{ secrets.THEDEMIANFF_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar dependencias 3D para APK offline
        run: |
          set -euo pipefail
          ASSETS=app/src/main/assets
          mkdir -p "$ASSETS"
          if grep -q 'src="three.min.js"' "$ASSETS/index.html" && [ ! -s "$ASSETS/three.min.js" ]; then
            curl --fail --location --retry 3 --silent --show-error "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js" -o "$ASSETS/three.min.js"
          fi
          if grep -q 'src="GLTFLoader.js"' "$ASSETS/index.html" && [ ! -s "$ASSETS/GLTFLoader.js" ]; then
            curl --fail --location --retry 3 --silent --show-error "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js" -o "$ASSETS/GLTFLoader.js"
          fi
          # V29: aceptar la subida móvil de Lila en la raíz de assets y normalizar la ruta.
          mkdir -p "$ASSETS/models"
          if [ ! -s "$ASSETS/models/lila-operator.glb" ]; then
            for source in "$ASSETS/operador-lila.glb" "$ASSETS/lila-operator.glb" "$ASSETS/models/operador-lila.glb"; do
              if [ -s "$source" ]; then
                cp "$source" "$ASSETS/models/lila-operator.glb"
                echo "Modelo Lila encontrado en $source; ruta normalizada."
                break
              fi
            done
          fi
          test -s "$ASSETS/index.html"
          test -s "$ASSETS/models/lila-operator.glb" || { echo "::error::Falta models/lila-operator.glb: no generar APK con Lila de respaldo"; exit 1; }
          # V44.2: verify the exact 3D assets used by the browser are packaged.
          test -s "$ASSETS/models/lila-v44-experimental.glb" || { echo "::error::Falta Lila V44.1 en APK"; exit 1; }
          test -s "$ASSETS/models/ak74-tactical.glb" || { echo "::error::Falta skin AK-74 en APK"; exit 1; }
          grep -q "models/lila-v44-experimental.glb" "$ASSETS/index.html" || { echo "::error::HTML no selecciona Lila V44.1"; exit 1; }
          grep -q "models/ak74-tactical.glb" "$ASSETS/index.html" || { echo "::error::HTML no selecciona AK-74"; exit 1; }
          grep -q "web.loadUrl(GAME_ORIGIN+GAME_PREFIX" app/src/main/java/com/thedemianff/lastzone/MainActivity.java || { echo "::error::WebView no usa origen HTTPS local"; exit 1; }
          grep -q 'getAssets().open(relative)' app/src/main/java/com/thedemianff/lastzone/MainActivity.java || { echo "::error::WebView no sirve modelos desde assets"; exit 1; }
          echo "V44.2 Android assets / Lila / AK-74 OK"
          echo "Recursos 3D presentes:"
          ls -lh "$ASSETS/index.html" "$ASSETS/three.min.js" "$ASSETS/GLTFLoader.js" "$ASSETS/models/lila-operator.glb"
          if grep -q 'src="three.min.js"' "$ASSETS/index.html"; then test -s "$ASSETS/three.min.js"; fi
          if grep -q 'src="GLTFLoader.js"' "$ASSETS/index.html"; then test -s "$ASSETS/GLTFLoader.js"; fi
      - name: Validar scripts y estructura del modelo 3D
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,struct,json,subprocess,tempfile
          root=Path("app/src/main/assets")
          html=(root/"index.html").read_text(encoding="utf-8")
          # V34.1: camera look owner cannot be stolen by a moving second finger.
          if "now-v26LastLookMove>85" in html: raise SystemExit("V34.1: cámara aún permite robo del puntero")
          if "!v23Touches.has(v26LookOwner)" not in html: raise SystemExit("V34.1: falta control de dueño de cámara")
          # V33: prevent untrusted JSON from restoring competitive progression.
          if "const entries=v33ValidateSettingsBackup(backup)" not in html: raise SystemExit("V33: restauración no validada")
          if "format:2,type:'settings'" not in html: raise SystemExit("V33: exportación de configuraciones ausente")
          if "V33_BACKUP_KEYS" not in html or "v33IsSettingsKey(k)" not in html: raise SystemExit("V33: lista blanca ausente")
          # V33 settings importer must remain strict; V44.3 guest snapshots use a separate validated format.
          settings_import=html.split('function v33ValidateSettingsBackup(backup){',1)[1].split('function ',1)[0]
          if "backup.format!==2" not in settings_import or "backup.type!=='settings'" not in settings_import:
              raise SystemExit("V33: importación de ajustes no restringida a formato 2")
          guest_import=html.split("$('v443RestoreFile').addEventListener('change',",1)[1].split("if(!window.THREE)",1)[0]
          if "backup.format!==1" not in guest_import or "v443ValidateProgress(backup.progress)" not in guest_import:
              raise SystemExit("V44.3: respaldo de invitado sin validación")
          if "for(const [k,v] of entries)localStorage.setItem(k,v);" not in html: raise SystemExit("V33: importación de ajustes ausente")
          # V44.5: backup actions are no longer duplicated in the lobby or Settings.
          if 'id="v29BackupButton"' in html: raise SystemExit("V44.5: respaldo antiguo sigue visible en ajustes")
          if 'data-tab="progress"' in html or 'data-section="progress"' in html: raise SystemExit("V44.5: pestaña PROGRESO duplicada")
          if 'id="v443Account"' in html: raise SystemExit("V44.5: botón CUENTA / RESPALDO sigue en lobby")
          if html.count('id="v445SettingsLogout"')!=1 or 'data-tab="account"' not in html: raise SystemExit("V44.5: falta cerrar sesión en Ajustes > Cuenta")
          if html.count('id="v443Backup"')!=1 or html.count('id="v443Restore"')!=1: raise SystemExit("V44.5: mecanismo de respaldo local eliminado")
          if 'document.body.appendChild(btn)' in html: raise SystemExit("Regresión: botón flotante de respaldo fuera de ajustes")
          # V40 architecture/combat presentation smoke checks: preserve approved runtime API.
          required_v40 = {
              "five weapon profiles": "gun.userData.v40Variants=v40Variants",
              "automatic weapon variant switch": "variants[i].visible=i===activeIndex",
              "animated plane propellers": "v36Aircraft.userData.v40Propellers",
              "airplane glide remains": "v36TickAircraft(dt)",
              "four recognizable districts": "const v40DistrictNames=['HELIOS','VORTEX','CRISTAL','ECOS']",
              "cached offline district signs": "v40SignCache.set(name,t)",
              "district roof variations": "v40DistrictEquipment(g,w,h,d,v40DistrictIndex)",
              "offline environmental instancing": "window.v40EnvironmentInstances=rockCount+treeCount*2",
              "six Aurora district motif families": "window.v40DistrictMotifs=motifCounts.reduce((a,b)=>a+b,0)",
              "visibility lighting": "visibilityLighting:true",
              "calibrated snow exposure": "renderer.toneMappingExposure=.72",
              "landscape HUD calibration": "v40ScreenshotHudCalibration",
              "V43 hybrid camera controller": "const v432Camera={",
              "V43 hybrid camera tick": "v432Camera.update(dt);",
              "loot halo": "v40PickupHalo=halo",
              "enemy markers": "v40EnemyMark=new THREE.MeshBasicMaterial",
              "district motif count exposed": "window.v40DistrictMotifTypes=motifMeshes.length",
              "camera-relative parachute": "cameraRight=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion)"
          }
          for check, marker in required_v40.items():
              if marker not in html: raise SystemExit(f"V40 regresión: {check}")
          print(f"V40 comprobaciones estructurales: {len(required_v40)} OK")
          scripts=re.findall(r"<script\b[^>]*>([\s\S]*?)</script\s*>",html,re.I)
          count=0
          for script in scripts:
              if not script.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8") as tmp:
                  tmp.write(script);tmp.flush()
                  subprocess.run(["node","--check",tmp.name],check=True)
                  count+=1
          if count==0: raise SystemExit("No se encontraron bloques JavaScript inline; revisar HTML")
          print(f"JavaScript HTML validado: {count} bloques")
          for name in ("three.min.js","GLTFLoader.js"):
              subprocess.run(["node","--check",str(root/name)],check=True)
          p=root/"models/lila-operator.glb"
          data=p.read_bytes()
          if len(data)<20 or data[:4]!=b"glTF": raise SystemExit("GLB inválido: falta cabecera glTF")
          magic,version,length=struct.unpack_from("<4sII",data)
          if version!=2 or length!=len(data): raise SystemExit("GLB inválido: versión o longitud")
          chunk_len,chunk_type=struct.unpack_from("<I4s",data,12)
          if chunk_type!=b"JSON": raise SystemExit("GLB inválido: bloque JSON ausente")
          doc=json.loads(data[20:20+chunk_len])
          names={node.get("name") for node in doc.get("nodes",[])}
          expected={"leftArm","rightArm","leftLeg","rightLeg"}
          missing=expected-names
          if missing: raise SystemExit("Faltan articulaciones de Lila: "+", ".join(sorted(missing)))
          if not doc.get("meshes"): raise SystemExit("GLB sin mallas")
          print(f"Lila validada: {len(doc['meshes'])} mallas y {len(doc.get('nodes',[]))} nodos")
          PY
      - name: Validar interfaz y controles críticos V37.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          ids=['v362Events','v362EventClose','v362EventStatus','v37ModeOverlay','v37ModeClose','v37FlightHUD','v37FlightJump','v36DropCanvas','v372ExitGame','minimap','leaveMatch']
          for element in ids:
              count=len(re.findall(r'id="'+re.escape(element)+r'"',html))
              if count!=1: raise SystemExit(f'ID de interfaz ausente o duplicado: {element} ({count})')
          required=['function v362ShowEvents()',"document.querySelectorAll('#menu [data-lobby]')",'function v36TickAircraft(dt)','v372PlaneTouch','function v372FlightMap()','THEDEMIANFFGame.exitGame()']
          for marker in required:
              if marker not in html: raise SystemExit('Control crítico no conectado: '+marker)
          if 'id="v37OpenDropMap"' in html: raise SystemExit('Regresión: botón MAPA redundante reapareció')
          print('Validación estática de controles: OK')
          PY
          python3 - <<'PY'
          from pathlib import Path
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          start=html.index('<script>')+len('<script>')
          end=html.rindex('</script>')
          Path('/tmp/thedemianff-inline.js').write_text(html[start:end],encoding='utf-8')
          PY
          node --check /tmp/thedemianff-inline.js
      - name: Verificar V38 interfaz eventos, personaje 360 y perfil FHD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          ids=['v38Operations','v38TabEvents','v38TabMissions','v38EventsView','v38MissionsView','v38MissionsContent','v38OpsClose','v24LobbyStage']
          for ident in ids:
              count=len(re.findall(r'id="'+re.escape(ident)+r'"',html))
              if count!=1: raise SystemExit(f'Interfaz faltante o duplicada: {ident} = {count}')
          required=['function v38OpenHub(','function v38SelectTab(','function v38RenderMissions(','function v381ShowEventDetails(mode)','v38LobbyTouch.addEventListener','function v38FhdRatio()','function v38NoiseBurst(']
          for item in required:
              if item not in html: raise SystemExit('Control o función ausente: '+item)
          if html.count('data-v38event=')!=2: raise SystemExit('Se esperaban dos desafíos activos')
          print('V38 verificaciones estáticas: OK')
          PY
      - name: V38.1 comprobar consulta de eventos sin auto-inicio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          for ident in ('v381EventDetail','v381SelectMode','v381DetailClose','v38Operations','v24LobbyStage'):
              count=len(re.findall(r'id="'+ident+r'"',html))
              if count!=1: raise SystemExit('Interfaz incorrecta: '+ident)
          required=('v381ShowEventDetails(button.dataset.v38event)','document.querySelectorAll(\'#menu [data-lobby]\')',
                    '#menu .v24Hero{z-index:30!important;pointer-events:auto!important',
                    "window.v36FlightMode==='aircraft'",'v372RefreshSettingsContext()')
          for token in required:
              if token not in html: raise SystemExit('Falta función o control: '+token)
          section=html[html.index("$('v38Operations').querySelectorAll('[data-v38event]')"):html.index("// Single immediate pointer action")]
          if 'start()' in section: raise SystemExit('Eventos no deben iniciar partidas')
          print('V38.1 interacciones estáticas OK')
          PY
      - name: V44.1 validar camara hibrida y ADS actuales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          required=('const v432Camera={','v432Camera.update(dt);',
                    "Number($('adsSensitivity').value)",
                    "Number($('verticalSensitivity').value)")
          for marker in required:
              if marker not in h: raise SystemExit('Camara V43 incompleta: '+marker)
          if 'function v382AimDelta(' in h:
              print('Legacy ADS helper retained; V43 camera validated')
          print('V44.1 camera/ADS static checks passed')
          PY
      - name: Verificar V38.3 lobby accesible y control del paracaidas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          required=[
           'id="v383LobbyLayout"',
           'data-lobby="INVENTARIO"',
           'data-lobby="ARMAS"',
           'data-lobby="PRESET"',
           'const glideSpeed=v398ChuteOpen?13.5:21;',
           'player.rotation.y+=turn',
           'player.position.y-=(v398ChuteOpen?(strength>.12?8.0:9.0):19.5)*dt;',
           'const cameraRight=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);',
           'const cameraForward=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);',
           "window.v36FlightMode==='descending'",
           "const inLobby=!running;"
          ]
          for token in required:
              if token not in h: raise SystemExit('V38.3 missing: '+token)
          if 'OPERACIÓN<br>ÚLTIMA ZONA' in h: raise SystemExit('Old banner remains')
          print('V38.3 static checks passed')
          PY
      - name: Validar entrada de invitado y acceso Google V44.5
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text()
          java=Path('app/src/main/java/com/thedemianff/lastzone/MainActivity.java').read_text()
          for token in ('id="v443Entry"','id="v443Guest"','id="v443Google"','id="v443Backup"','id="v443Restore"','id="v443RestoreFile"','id="v445SettingsLogout"','thedemianff_v443_guest_id','thedemianff_progress_v18','v443ValidateProgress','localStorage.setItem(progressKey,JSON.stringify(progress))','window.THEDEMIANFFBackup.saveBackup(content)'):
              assert token in h, 'Missing V44.3 guest entry: '+token
          for token in ("if(!raw)throw Error('No hay progreso guardado", "const data=v443ValidateProgress(raw)", "Este respaldo contiene:", "este respaldo tiene MENOS XP"):
              assert token in h, 'V44.3.1 backup integrity missing: '+token
          assert 'id="v443Account"' not in h, 'V44.5: CUENTA / RESPALDO reapareció en lobby'
          assert 'data-tab="account"' in h, 'V44.5: falta ajustes de cuenta'
          assert 'id="v445Play"' not in h, 'V44.5: inicio Google exige clic innecesario'
          for token in ('id="v446AccountRefresh"','id="v446LocalIdentity"','id="v446LocalProgress"','function v446UpdateAccountProfile()','v446AuthResolved','},8000);','v446GoogleEmail'):
              assert token in h, 'V44.6: falta funcionalidad de cuenta/perfil: '+token
          for token in ('id="v447ExportProgress"','id="v447ImportProgress"','id="v447BackupStatus"','id="v447RefreshProgress"','function v447BackupNotice(text)',"$('v447ExportProgress').addEventListener('click',()=>$('v443Backup').click())","$('v447ImportProgress').addEventListener('click',()=>$('v443Restore').click())"):
              assert token in h, 'V44.7: falta respaldo manual en ajustes: '+token
          assert h.count('id="v447ExportProgress"')==1 and h.count('id="v447ImportProgress"')==1, 'V44.7: controles de respaldo duplicados'
          assert "if(!confirm(summary+(present?" in h, 'V44.7: falta advertencia antes de restaurar'
          assert "if(file.size>1000000)" in h, 'V44.7: falta límite de tamaño en la restauración'
          assert "v443ValidateProgress(backup.progress)" in h, 'V44.7: falta validación del respaldo'
          assert "v443Native.saveProgress(JSON.stringify(progress))" in h, 'V44.7: falta persistencia nativa al restaurar'
          assert 'const prevNativeProgress=v443Native?v443Native.readProgress():null;' in h, 'V44.8: falta copia previa nativa'
          assert 'const prevNativeGuest=v443Native?v443Native.readGuestId():null;' in h, 'V44.8: falta identidad previa nativa'
          assert "backup.guestId!==guestId" in h, 'V44.8: falta aviso por cambio de invitado'
          assert 'v443Native.saveProgress(prevNativeProgress)' in h, 'V44.8: falta rollback nativo'
          assert 'v443Native.saveGuestId(prevNativeGuest)' in h, 'V44.8: falta rollback de identidad'
          assert 'v443Native.clearProgress()' in h, 'V44.9: falta revertir progreso nativo inicialmente vacío'
          assert 'v443Native.clearGuestId()' in h, 'V44.9: falta revertir ID nativo inicialmente vacío'
          assert '@JavascriptInterface public boolean clearProgress()' in java, 'V44.9: falta puente nativo de rollback de progreso'
          assert '@JavascriptInterface public boolean clearGuestId()' in java, 'V44.9: falta puente nativo de rollback de ID'
          assert '.edit().remove("progress").commit()' in java, 'V44.9: borrado limitado al campo de progreso'
          assert '.edit().remove("guestId").commit()' in java, 'V44.9: borrado limitado al campo de invitado'
          for token in ('id="v45LobbyRecord"','id="v45XPFill"','v45ProfileName','v45HeroCard','v45HeroStats','id="v45OpenAccount"','v45OpenAccount','v45Record.textContent','v45Fill.style.width',"v18Open('ESTADÍSTICAS')"):
              assert token in h, 'V45: falta panel de operador/lobby: '+token
          assert 'aria-valuemax="350"' in h, 'V45: falta progreso de nivel accesible'
          assert h.count('body.innerHTML=html;')==1, 'V45.1: panel renderizado dos veces, pierde eventos'
          assert "if(v45AccountButton)v45AccountButton.addEventListener('click'" in h, 'V45.1: falta navegación a cuenta'
          assert "$('v18Profile').focus();" in h, 'V45.1: falta restaurar foco del perfil'
          assert "track.setAttribute('aria-valuenow',String(levelXP))" in h, 'V45.2: progreso accesible sin valor actualizado'
          assert 'Number.isSafeInteger(p.xp)&&p.xp>=0' in h, 'V45.2: XP local sin validación'
          assert "function resume(){v123ResetInputs();clock.getDelta();" in h, 'V45.3: reanudar con controles sin reiniciar'
          assert "window.addEventListener('blur',()=>{if(running){v123ResetInputs()" in h, 'V45.3: falta limpieza táctil en segundo plano'
          assert "if(running){v123ResetInputs();keys={};stick.style.transform" in h, 'V45.3: falta limpieza al ocultar ventana'
          assert "Math.hypot(dx,dy)>Math.max(180,Math.min(innerWidth,innerHeight)*.45)" in h, 'V45.4: falta filtro de salto táctil'
          assert "t.startX=t.x;t.startY=t.y;v22FireDragging=false;v23FireThumb(t);" in h, 'V45.8: disparo debe recalibrar origen al descartar salto'
          assert "if(role!=='look'&&[...v23Touches.values()].some(t=>t.role===role))" in h, 'V45.5: acciones duplicadas por multitouch'
          assert "if(v23Touches.has(e.pointerId))return;" in h, 'V45.5: puntero registrado dos veces'
          # V45.6: multi-feature Android touch regression guards
          for token in (
              'const v456TouchFeatures=', 'function v456InsideViewport(x,y)',
              'function v456OverlayTarget(target)', "if(role==='look'&&[...v23Touches.values()]",
              "if(role==='look'&&e.target.closest?.('button,input",
              'lastAt:performance.now()', 'if(gap>320',
              'v342JoyOrigin.x=clamp(', "v26LookOwner=next?next[0]:null",
              '✋ ', "window.addEventListener('orientationchange'",
              'Number.isSafeInteger(p.credits)&&p.credits>=0',
              "&&!gameOver&&!document.hidden"
          ):
              assert token in h, 'V45.6: falta mejora de controles '+token
          for token in (
              'sprintHeld=false;adsHeld=false;crouchHeld=false;jumpQueued=false;',
              "classList.remove('v382ADS')",
              'if(v23Touches.size>=6)return;',
              'v23PointerEnd(e);return;',
              't.startX=t.x;t.startY=t.y;v22FireDragging=false;',
              "window.addEventListener('resize',()=>{if(running&&v23Touches.size)v123ResetInputs();});"
          ):
              assert token in h, 'V45.7: falta recuperación táctil '+token
          for token in ('#v123InputTest.v458Multi','#v123InputTest.v458Firing',
                        'env(safe-area-inset-bottom)','prefers-reduced-motion',
                        "monitor.classList.toggle('v458Multi'",
                        "monitor.classList.toggle('v458Firing'"):
              assert token in h, 'V45.8: falta indicador de combate '+token
          for token in ('/* V45.9: readable combat overlays', '#v7Compass{top:max(8px',
                        '#v362LootLegend{border-left:3px', '#missionHud{max-width:92vw',
                        '#v13AimMode{padding:3px', '#v10Reticle{box-shadow:',
                        '#v7Toast,#combatFeed{max-width:90vw', '@media(orientation:portrait)'):
              assert token in h, 'V45.9: falta mejora visual '+token
          for token in ('#health.v460Low','#health.v460NoShield',
                        '#weapon.v460LowAmmo','#weapon.v460Empty',
                        '#weapon.v460Reload',"healthPanel.classList.toggle('v460Low'",
                        "weaponPanel.classList.toggle('v460Empty'",
                        "weaponPanel.classList.toggle('v460Reload'"):
              assert token in h, 'V46.0: falta indicador de estado '+token
          for token in ('#health.v461Critical','#weapon.v461LastRounds',
                        '#weapon.v461EmptyClip','#zoneInfo.v461ZoneDanger',
                        "healthPanel.classList.toggle('v461Critical'",
                        "weaponPanel.classList.toggle('v461LastRounds'",
                        "classList.toggle('v461ZoneDanger'"):
              assert token in h, 'V46.1: falta alerta de combate '+token

          assert "if(name==='ESTADÍSTICAS')" in h, 'V45: falta panel de estadísticas del jugador'
          for metric in ('PORCENTAJE DE VICTORIAS','BAJAS POR PARTIDA','MEJOR MARCA','XP PARA SUBIR'):
              assert metric in h, 'V45: falta métrica '+metric
          assert 'p.matches?Math.round(p.wins/p.matches*100):0' in h, 'V45: estadística de victorias debe evitar división por cero'
          assert 'id="v443Guest" type="button" style="display:none;' in h, 'V44.5: invitado visible durante validación Google'
          assert 'id="v443Google" type="button" style="display:none;' in h, 'V44.5: Google visible antes del estado de sesión'
          assert "if(!v445GoogleBridge){" in h, 'V44.5: Chrome sin recuperación de acceso'
          assert "guest.style.display='block';" in h, 'V44.5: acceso manual no reaparece sin sesión'
          assert "' · progreso local en este dispositivo'" in h, 'V44.5: estado de cuenta debe aclarar almacenamiento local'
          google=h.split('window.thedemianffGoogleResult=function(state,detail){',1)[1].split("}else if(state==='signed_out'){",1)[0]
          assert "entry.style.display='none';" in google, 'V44.5: Google no entra automáticamente al lobby'
          print('V44.5 login, guest backup integrity and clean lobby checks OK')
          PY
      - name: V44.3.2 verificar autoguardado de invitado en Android
