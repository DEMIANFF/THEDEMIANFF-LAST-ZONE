name: V75.19 Complete Godot Regression QA
on:
  push:
    branches: [codex/v71-native-battle-royale-foundation, codex/v72-native-visual-slice, codex/v73-native-quality-combat, codex/v73-motorola-video-audit, codex/v73-1-motorola-fixes, codex/v73-2-tps-fire-drag, codex/v74-aurora-offline-royale, codex/v74-1-weapons-ik-awm, codex/v75-br-flow-animations, codex/v75-1-real-match-progression, codex/v75-2-motorola-recovery, codex/v75-3-battle-royale-improvements, codex/v75-4-aim-animation-recovery, codex/v75-5-aurora-lobby-combat-ui, codex/v75-6-puerto-aurora-3d-district, codex/v75-7-terrain-camera-audio-repair, codex/v75-8-world-navigation-stabilization, codex/v75-9-camera-obstruction-polish, codex/v75-10-materials-locomotion-pass, codex/v75-11-aurora-gait-coastal-detail, codex/v75-11-landing-stability-fix, codex/v75-12-per-scope-mobile-settings, codex/v75-13-aurora-deployable-cover, codex/v75-14-mobile-freefall-crash-recovery, codex/v75-15-aircraft-jump-transition-isolation, codex/v75-16-aircraft-startup-isolation, codex/v75-17-mobile-freefall-terrain-protection, codex/v75-18-parachute-transition-isolation, codex/v75-19-prewarmed-canopy-native-trace, codex/godot-canopy-physics-audit]
    paths:
      - 'native-godot/**'
      - 'docs/V71_REAL_BATTLE_ROYALE_MASTER_PLAN.md'
      - '.github/workflows/native-godot-foundation.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2 editor
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version
      - name: Prepare visual test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          bash native-godot/tools/prepare_assets.sh /tmp/aurora-operator
      - name: Run complete native QA with imported operator and weapons
        run: bash native-godot/tools/run_qa.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V75.19-GODOT-QA-LOGS
          path: native-godot/out/qa
