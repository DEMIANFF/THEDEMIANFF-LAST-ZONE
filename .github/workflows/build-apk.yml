name: Compilar APK offline THEDEMIANFF

on:
  workflow_dispatch:
  push:
    branches: [main, v22-complete-upgrade]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Incluir motor Three.js y cargador GLB sin conexión
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js -o app/src/main/assets/three.min.js
          curl --fail --location --retry 3 --silent --show-error https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js -o app/src/main/assets/GLTFLoader.js
          test -s app/src/main/assets/three.min.js
          test -s app/src/main/assets/GLTFLoader.js
      - name: Generar personaje Lila GLB original
        run: |
          python3 -m pip install --quiet numpy trimesh
          python3 tools/generate_lila.py
          test -s app/src/main/assets/models/lila-operator.glb
      - name: Validar modelo Lila y articulaciones
        run: |
          python3 - <<'PY'
          import trimesh
          path='app/src/main/assets/models/lila-operator.glb'
          scene=trimesh.load(path,force='scene')
          nodes=set(scene.graph.nodes)
          required={'leftArm','rightArm','leftLeg','rightLeg','leftHair','rightHair'}
          missing=required-nodes
          assert not missing, f'Faltan articulaciones de Lila: {sorted(missing)}'
          assert len(scene.geometry)>=40, 'Modelo incompleto'
          print('Lila GLB verificado:',len(scene.geometry),'mallas,',len(nodes),'nodos')
          PY
      - name: Comprobar sintaxis JavaScript del juego
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('app/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          main=max(blocks,key=len)
          assert len(main)>30000, 'No se encontró el motor principal del juego'
          pathlib.Path('/tmp/thedemianff-game.js').write_text(main)
          PY
          node --check /tmp/thedemianff-game.js
      - name: Pruebas de regresión de cámara y controles táctiles V22
        run: python3 tools/test_v22_controls.py
      - name: Compilar APK debug
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: THEDEMIANFF-V22-APK-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
