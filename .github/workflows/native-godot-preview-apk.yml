name: Aurora V75.131 touch mode-gallery and signed Motorola APK trial
concurrency:
  # Separate renamed frontend pipelines from superseded jobs while still
  # cancelling repeated commits of the SAME workflow on the same branch.
  group: aurora-android-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
on:
  push:
    branches: [codex/v75-124-roof-collision-aurora-integration, codex/v72-native-visual-slice, codex/v73-native-quality-combat, codex/v73-1-motorola-fixes, codex/v73-2-tps-fire-drag, codex/v74-aurora-offline-royale, codex/v74-1-weapons-ik-awm, codex/v75-br-flow-animations, codex/v75-1-real-match-progression, codex/v75-2-motorola-recovery, codex/v75-3-battle-royale-improvements, codex/v75-4-aim-animation-recovery, codex/v75-5-aurora-lobby-combat-ui, codex/v75-6-puerto-aurora-3d-district, codex/v75-7-terrain-camera-audio-repair, codex/v75-11-aurora-gait-coastal-detail, codex/v75-11-landing-stability-fix, codex/v75-12-per-scope-mobile-settings, codex/v75-13-aurora-deployable-cover, codex/v75-14-mobile-freefall-crash-recovery, codex/v75-15-aircraft-jump-transition-isolation, codex/v75-16-aircraft-startup-isolation, codex/v75-17-mobile-freefall-terrain-protection, codex/v75-18-parachute-transition-isolation, codex/v75-19-prewarmed-canopy-native-trace, codex/godot-canopy-physics-audit, codex/godot-flight-blackbox-diagnostics, codex/godot-shared-scene-crash-audit, codex/v75-20-training-freefall-crash-isolation, codex/v75-21-mobile-physics-animation-hardening, codex/v75-22-motorola-crash-window-recovery, codex/v75-23-android-audio-thread-recovery, codex/v75-24-wav-loop-buffer-safety, codex/v75-25-120hz-stable-preview-signing, codex/v75-26-camera-controls-motion-polish, codex/v75-27-lobby-hud-editor, codex/v75-28-puerto-aurora-sector-expansion, codex/v75-29-zone-bot-sync-house-qa, codex/v75-30-combat-sound-awareness, codex/v75-34-integrated-combat-inventory-aurora, codex/v75-40-residential-terrain-foundations, codex/v75-41-house-hud-settings-integration, codex/v75-42-aurora-tactical-map-aircraft-brand, codex/v75-43-map-lobby-brand-awm-polish, codex/v75-44-aurora-playable-scale-visual-core, codex/v75-45-mobile-render-pipeline-budget, codex/v75-46-vulkan-mobile-ab-test, codex/v75-47-vulkan-frame-pacing-optimizations, codex/v75-48-vulkan-only-real-battle-loot, codex/v75-49-tactical-healing-vulkan, codex/v75-50-tactical-ai-combat-vulkan, codex/v75-55-unified-battle-royale-integration-vulkan, codex/v75-56-combat-feedback-quality-vulkan, codex/v75-57-ten-minute-match-ledger-vulkan, codex/v75-58-physical-headshots-vulkan, codex/v75-59-lila-aurora-rig-identity-vulkan, codex/v75-60-lila-hair-weapon-holsters-vulkan, codex/v75-61-lila-motion-precision-vulkan, codex/v75-62-tactical-bot-medicine-vulkan, codex/v75-63-lila-3d-medkit-animation-vulkan, codex/v75-64-physical-opponent-inventory-loot-vulkan, codex/v75-65-lila-tactical-strafe-animations-vulkan, codex/v75-66-hit-react-awm-animation-vulkan, codex/v75-67-lobby-classic-ranked-gating-vulkan, codex/v75-68-local-coins-wallet-vulkan, codex/v75-69-unified-objectives-lobby-vulkan, codex/v75-70-local-profile-autobackup-recovery-vulkan, codex/v75-71-verified-local-profile-export-vulkan, codex/v75-72-firebase-backup-server-contract, codex/v75-73-player-name-sequential-id-vulkan, codex/v75-74-firebase-auth-appcheck-bridge-preflight-vulkan, codex/v75-75-android-firebase-native-plugin-vulkan, codex/v75-76-motorola-firebase-gradle-integration-vulkan, codex/v75-77-lobby-account-ux-firebase-native, codex/v75-78-aurora-full-lobby-login-navigation, codex/v75-79-aurora-premium-lobby-overhaul, codex/v75-80-lobby-vram-lifecycle-vulkan, codex/v75-81-fifty-ai-final-zone-vulkan, codex/v75-82-aurora-free-pass-ledger-vulkan, codex/v75-83-mobile-ai-rig-budget-vulkan, codex/v75-84-near-combat-ai-rig-priority-vulkan, codex/v75-85-real-local-skin-shop-vulkan, codex/v75-86-real-outfit-visual-review-vulkan, codex/v75-87-single-50-player-br-lobby-vulkan, codex/v75-88-moving-safe-zone-br-vulkan, codex/v75-89-50-bot-ai-frame-budget-vulkan, codex/v75-90-br-ai-rotation-vulkan, codex/v75-91-final-ring-ai-stability-vulkan, codex/v75-92-gunfire-radar-privacy-vulkan, codex/v75-93-physical-elimination-integrity-vulkan, codex/v75-94-storm-ai-threat-and-route-pacing-vulkan, codex/v75-95-safe-parachute-landing-roster-vulkan, codex/v75-96-physical-bot-elimination-animation-vulkan, codex/v75-97-directional-opponent-impact-reactions-vulkan, codex/v75-98-last-confirmed-target-ai-vulkan, codex/v75-99-occluded-cover-fire-physical-visibility-vulkan, codex/v75-100-physical-bot-weapon-animations-vulkan, codex/v75-101-opponent-hand-rifle-attachments-vulkan, codex/v75-102-bot-rifle-muzzle-visuals-vulkan, codex/lila-aurora-vulkan, codex/v75-103-aurora-v3-combat, codex/v75-104-aurora-audio-lobby, codex/v75-105-aurora-entry-flow, codex/v75-106-aurora-hud-real-layout, codex/v75-107-aurora-live-lobby-polish, codex/v75-108-aurora-interactive-operator-lobby, codex/v75-109-aurora-production-ui-rebuild, codex/v75-110-motorola-touch-loading-safe, codex/v75-111-lila-lobby-fullbody-framing, codex/v75-112-aurora-login-responsive-polish, codex/v75-113-aurora-premium-frontend-reconstruction, codex/v75-114-aurora-natural-mountain-stage, codex/v75-115-aurora-frontend-art-and-touch, codex/v75-116-aurora-arctic-airfield, codex/v75-117-evidence-driven-awm-action-audio, codex/v75-117-motorola-signed-test-build, codex/v75-123-aurora-motorola-apk-qa, codex/v75-124-roof-collision-aurora-integration, codex/v75-128-armory-horizontal-zone-ring-accuracy, codex/v75-129-functional-aurora-armory-categories, codex/v75-130-inventory-operators-real-ui, codex/v75-131-aurora-mode-gallery-real-gating]
    paths:
      - 'native-godot/**'
      - 'functions/**'
      - '.github/workflows/native-godot-preview-apk.yml'
      - '.github/qa-signing/**'
      - 'firebase-godot-bridge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v5
      # Fail fast on version metadata, before Blender, Godot and Android setup.
      - name: Preflight Mobile/Vulkan preview version, ABI and export path
        run: python3 native-godot/tools/configure_android_renderer.py --variant mobile
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false  # Keep CI behavior deterministic; no dependency installation here.
      - name: Verify Firebase Android bridge prerequisites (no deployment)
        run: python3 native-godot/tools/audit_firebase_native_preflight.py --assert-blocked
      - name: Preflight exact-package Firebase JSON before expensive Android build
        env:
          AURORA_NATIVE_GOOGLE_SERVICES_B64: ${{ secrets.AURORA_NATIVE_GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${AURORA_NATIVE_GOOGLE_SERVICES_B64:-}" ]; then
            umask 077
            CONFIG="$(mktemp /tmp/aurora-firebase-config.XXXXXX.json)"
            trap 'rm -f "$CONFIG"' EXIT
            printf '%s' "$AURORA_NATIVE_GOOGLE_SERVICES_B64" | base64 --decode > "$CONFIG"
            python3 native-godot/tools/prepare_firebase_gradle_trial.py validate --firebase-json "$CONFIG"
          else
            echo "AURORA_FIREBASE_JSON_PREFLIGHT_DIAGNOSTIC_ONLY missing_secret=1"
          fi
      - name: Test official Godot Android Gradle resource layout without credentials
        run: python3 -m unittest discover -s native-godot/tools -p 'test_firebase_gradle_trial.py' -v
      - name: Test Firebase offline-progress callables (no deployment)
        run: |
          node --version
          node --check functions/src/index.js
          node --check functions/src/offline-progress.js
          node --check functions/src/player-profile.js
          node --test functions/test/*.test.js
      # Generated CC0 models depend only on the pinned source and converter.
      # On retries use validated cached GLBs; never repeat a large Blender
      # installation when the exact source scripts are unchanged.
      - name: Cache reproducible Aurora model GLBs
        id: aurora-model-cache
        uses: actions/cache@v5
        with:
          path: |
            native-godot/assets/characters/aurora_operator.glb
            native-godot/assets/weapons/aurora_awm.glb
          key: aurora-godot472-original-glbs-v1-${{ hashFiles('native-godot/tools/fetch_operator.sh', 'native-godot/tools/convert_operator.py', 'native-godot/tools/build_awm.py') }}
          # Caches save automatically after successful jobs; no deprecated flag.
      - name: Prepare CC0 detailed AI rig source (pinned and verified)
        if: ${{ steps.aurora-model-cache.outputs.cache-hit != 'true' }}
        run: bash native-godot/tools/fetch_operator.sh /tmp/aurora-operator
      - name: Install official Blender 4.0.2 portable archive (no apt install)
        if: ${{ steps.aurora-model-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          # Ubuntu's apt-get Blender installation timed out repeatedly.
          # Use Blender's exact 4.0.2 official standalone Linux build instead.
          # Check the archive against the official SHA-256 release manifest.
          name="blender-4.0.2-linux-x64.tar.xz"
          version_manifest="blender-4.0.2.sha256"
          primary="https://download.blender.org/release/Blender4.0"
          backup="https://ftp.blender.org/release/Blender4.0"
          download() {
            local filename="$1"
            local output="$2"
            if ! curl --fail --location --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 480 "$primary/$filename" -o "$output"; then
              rm -f "$output"
              curl --fail --location --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 480 "$backup/$filename" -o "$output"
            fi
          }
          cd /tmp
          download "$name" "$name"
          download "$version_manifest" "$version_manifest"
          test "$(stat -c '%s' "$name")" -eq 277588768
          grep -F "$name" "$version_manifest" | sha256sum --check --status
          echo "AURORA_OFFICIAL_BLENDER_SHA256_PASS blender=4.0.2"
          mkdir -p /tmp/aurora-blender
          tar -xJf "$name" -C /tmp/aurora-blender
          bin="/tmp/aurora-blender/blender-4.0.2-linux-x64"
          test -x "$bin/blender"
          "$bin/blender" --background --version | head -n 2
          echo "$bin" >> "$GITHUB_PATH"
          rm -f "/tmp/$name" "/tmp/$version_manifest"
      - name: Generate the detailed AI rig from verified CC0 source
        if: ${{ steps.aurora-model-cache.outputs.cache-hit != 'true' }}
        run: |
          blender -b --python native-godot/tools/convert_operator.py -- \
            /tmp/aurora-operator/attractor_mechanic_tpose.fbx \
            /tmp/aurora-operator/attractor_mechanic_tpose.png \
            native-godot/assets/characters/aurora_operator.glb
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          f=Path('native-godot/assets/characters/aurora_operator.glb')
          data=f.read_bytes()
          magic,ver,total=struct.unpack_from('<III',data)
          assert magic==0x46546c67 and ver==2 and total==len(data)
          chunk_length,chunk_type=struct.unpack_from('<II',data,12)
          assert chunk_type==0x4e4f534a
          scene=json.loads(data[20:20+chunk_length])
          print('Skinned GLB:',f.stat().st_size,'bytes',len(scene.get('skins',[])),'skins',len(scene.get('animations',[])),'clips',len(scene.get('meshes',[])),'meshes')
          assert len(scene.get('skins',[]))>=1,'Rigged character has no skin'
          assert len(scene.get('animations',[]))>=1,'Character has no animation clips'
          animation_names={anim.get('name','') for anim in scene.get('animations',[])}
          for required in ('AuroraArmedStrafeLeft','AuroraArmedStrafeRight','AuroraArmedBackpedal'):
              assert any(required in name for name in animation_names), (
                  'The original skinned tactical locomotion clip is missing: '+required)
          print('LILA_DIRECTIONAL_ANIMATION_GLTF_PASS',sorted(
              a for a in animation_names if 'Strafe' in a or 'Backpedal' in a))
          impact_clips=('AuroraHitFront','AuroraHitBack',
                        'AuroraHitLeft','AuroraHitRight','AuroraFireAWM')
          for required in impact_clips:
              assert any(required in name for name in animation_names), (
                  'Direction-aware physical combat animation not in GLB: '+required)
          print('LILA_IMPACT_RECOIL_GLTF_PASS',len(impact_clips),'skinned clips')
          kit_meshes=[m for m in scene.get('meshes',[])
                      if 'LilaAuroraSignature' in m.get('name','')]
          kit_nodes=[n for n in scene.get('nodes',[])
                     if n.get('name')=='LilaAuroraSignatureKit']
          kit_mats=[m for m in scene.get('materials',[])
                    if m.get('name','').startswith('LilaAurora') and
                       not m.get('name','').startswith('LilaAuroraHair')]
          assert len(kit_meshes)==1,'Lila original tactical kit is absent'
          assert len(kit_nodes)==1 and 'skin' in kit_nodes[0],\
              'Lila kit is not weighted to original humanoid skeleton'
          assert len(kit_mats)==3,'Lila signature needs three shared PBR materials'
          kit_vertices=sum(scene['accessors'][p['attributes']['POSITION']]['count']
                           for p in kit_meshes[0]['primitives'])
          assert 152<=kit_vertices<=1500, 'Lila original kit geometry too large or missing'
          hair_meshes=[m for m in scene.get('meshes',[])
                       if 'LilaAuroraHairSculpt' in m.get('name','')]
          hair_nodes=[n for n in scene.get('nodes',[])
                      if n.get('name')=='LilaAuroraOriginalHair']
          hair_mats=[m for m in scene.get('materials',[])
                     if m.get('name','').startswith('LilaAuroraHair')]
          assert len(hair_meshes)==1, 'Original Lila curved hair mesh was not exported'
          assert len(hair_nodes)==1 and 'skin' in hair_nodes[0], \
              'Lila hairstyle is not weighted to the humanoid armature'
          assert len(hair_mats)==3,'Lila sculpted hair needs 3 original PBR materials'
          hair_vertices=sum(scene['accessors'][p['attributes']['POSITION']]['count']
                            for p in hair_meshes[0]['primitives'])
          assert 1200<=hair_vertices<=12000, 'Lila mobile hair vertex budget violated'
          print('LILA_SIGNATURE_GLTF_PASS',len(kit_nodes),'skinned armor,',
                kit_vertices,'vertices,',len(kit_mats),'materials')
          print('LILA_HAIR_GLTF_PASS',len(hair_nodes),'skinned hairstyle,',
                hair_vertices,'vertices,',len(hair_mats),'materials')
          PY
      - name: Build original AWM GLB from authored Blender mesh
        if: ${{ steps.aurora-model-cache.outputs.cache-hit != 'true' }}
        run: |
          blender --background --python native-godot/tools/build_awm.py -- native-godot/assets/weapons/aurora_awm.glb
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          p=Path('native-godot/assets/weapons/aurora_awm.glb')
          blob=p.read_bytes()
          magic,version,length=struct.unpack_from('<III',blob)
          assert (magic,version,length)==(0x46546c67,2,len(blob))
          n,t=struct.unpack_from('<II',blob,12)
          assert t==0x4e4f534a
          payload=json.loads(blob[20:20+n])
          print('ORIGINAL_AWM_MESH',len(payload.get('meshes',[])),'GLB_BYTES',p.stat().st_size)
          assert len(payload.get('meshes',[]))>=32, 'AWM missing real modelling detail'
          PY
      - name: Verify cached or generated GLBs against Aurora rig requirements
        run: python3 native-godot/tools/verify_prepared_model_glbs.py
      - name: Install Godot 4.7.2 editor
        run: |
          curl -fL --retry 3 --retry-delay 3 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/aurora-godot.zip
          unzip -q /tmp/aurora-godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version
      - name: Install matching Godot Android export templates
        run: |
          curl -fL --retry 3 --retry-delay 4 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz' -o /tmp/aurora-templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -jo /tmp/aurora-templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' 'templates/android_source.zip' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          echo 4.7.2.stable > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"
          rm /tmp/aurora-templates.tpz
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform and SDK build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.1" "platform-tools" >/dev/null
      - name: Configure Godot Android SDK (never regenerate preview signing key)
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import 3D models and parse project
        run: godot --headless --path native-godot --editor --quit
      - name: Run complete native QA and Motorola regressions
        run: bash native-godot/tools/run_qa.sh
      # Use the same tag as the actual GDScript screenshot writers.
      - name: Resolve screenshot tag from the Godot Android export preset
        run: |
          set -euo pipefail
          tag="$(python3 - <<'PY'
          import re
          from pathlib import Path
          preset=Path('native-godot/export_presets.cfg').read_text()
          match=re.search(r'^version/name="(\d+)\.(\d+)\.[^"]+"$', preset, re.M)
          if match is None:
              raise SystemExit('Invalid Android version/name in export_presets.cfg')
          print('v'+match.group(1)+'-'+match.group(2))
          PY
          )"
          test -n "$tag"
          printf 'AURORA_CAPTURE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          echo "AURORA_CAPTURE_TAG=$tag"
      - name: Capture actual Godot scene with software OpenGL
        continue-on-error: false
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/tmp/aurora-xvfb.log
          mkdir -p native-godot/out
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_preview.gd
          test -s native-godot/out/aurora-native-v75-19-preview.png
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_frontend_preview.gd
          test -s native-godot/out/aurora-v75-19-welcome.png
          test -s native-godot/out/aurora-v75-19-lobby.png
          test -s native-godot/out/aurora-v75-77-account.png
          test -s "native-godot/out/aurora-${AURORA_CAPTURE_TAG}-loading.png"
          test -s "native-godot/out/aurora-${AURORA_CAPTURE_TAG}-login.png"
          test -s "native-godot/out/aurora-${AURORA_CAPTURE_TAG}-lobby.png"
          test -s "native-godot/out/aurora-${AURORA_CAPTURE_TAG}-account.png"
          echo "AURORA_FRONTEND_CAPTURE PASS version=${AURORA_CAPTURE_TAG} login=lobby=account rendered_on_Godot"
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_real_skin_variants.gd
          for outfit in aurora_base aurora_glacier aurora_ember; do
            test -s "native-godot/out/aurora-${AURORA_CAPTURE_TAG}-skin-${outfit}.png"
          done
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_coastal_preview.gd
          test -s native-godot/out/aurora-v75-19-coastal-quarter.png
          test -s native-godot/out/aurora-v75-19-coastal-street.png
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_weapon_preview.gd
          test -s native-godot/out/aurora-v74-1-ak74.png
          test -s native-godot/out/aurora-v74-1-awm.png
          # Separate actual 964x434 Xvfb capture to evaluate touch-safe composition.
          xvfb-run -a -s "-screen 0 964x434x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_motorola_frontend_qa.gd
          for screen in loading login lobby; do
            test -s "native-godot/out/aurora-${AURORA_CAPTURE_TAG}-motorola-${screen}.png"
          done
          echo "AURORA_MOTOROLA_FRONTEND_CAPTURE PASS 964x434"
          # Real showroom GLBs, same phone-aspect viewport. Desktop render
          # evidence only; actual Motorola/Vulkan test remains separate.
          xvfb-run -a -s "-screen 0 964x434x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_motorola_armory_qa.gd
          for weapon in ar awm scar mp40; do
            test -s "native-godot/out/aurora-${AURORA_CAPTURE_TAG}-motorola-armory-${weapon}.png"
          done
          echo "AURORA_ARMORY_MOTOROLA_VIEWPORT_CAPTURE PASS models=4"
          # Additional real UI captures, not artwork or mockups.
          xvfb-run -a -s "-screen 0 964x434x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_motorola_inventory_operator_qa.gd
          for screen in inventory operator-lila; do
            test -s "native-godot/out/aurora-${AURORA_CAPTURE_TAG}-motorola-${screen}.png"
          done
          test -s "native-godot/out/aurora-${AURORA_CAPTURE_TAG}-motorola-mode-gallery.png"
          echo "AURORA_MODE_GALLERY_CAPTURE PASS resolution=964x434 cards=3"
