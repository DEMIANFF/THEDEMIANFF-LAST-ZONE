          java=Path('app/src/main/java/com/thedemianff/lastzone/MainActivity.java').read_text()
          assert 'versionCode 98' in gradle, 'La actualización requiere versionCode 82'
          assert "versionName '46.1-combat-alerts'" in gradle, 'Versión Android incorrecta'
          assert 'firebaseAuth.signOut();' in java, 'No se cierra sesión Firebase'
          assert 'authMessage("signed_out","Sesión local de Google cerrada.");' in java, 'Falta confirmación local inmediata'
          assert 'org.json.JSONArray unlocked=parsed.optJSONArray' in java, 'Falta validar respaldo Android'
