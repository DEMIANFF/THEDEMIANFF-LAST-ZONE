      - name: V58.1 validar cámara TPS, vuelo y ADS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          required=(
              'const v58Camera={',
              'v58Camera.update(dt);',
              'const v58Sights={',
              'function v58FlightPointerDown(e)',
              'function v58FlightPointerMove(e)',
              'v58Camera.updateAngles(dt);',
              "v58SetFlightMode('aircraft')",
              "v58SetFlightMode('descending')",
              "v58SetFlightMode('landed')",
              'body.v58FlightMode #cross',
              'body.v58FlightMode #v10Reticle',
          )
          for marker in required:
              if marker not in h:
                  raise SystemExit('V58.1 camera/flight component missing: '+marker)
          if 'const v432Camera={' in h or 'let v372PlaneTouch=' in h:
              raise SystemExit('Legacy camera owner is still active')
          print('V58.1 TPS/flight/ADS static checks passed')
          PY
