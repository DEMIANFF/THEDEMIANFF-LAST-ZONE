name: V75.20 Two Android Crash Windows Godot QA
concurrency:
  group: aurora-native-qa-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [codex/v71-native-battle-royale-foundation, codex/v72-native-visual-slice, codex/v73-native-quality-combat, codex/v73-motorola-video-audit, codex/v73-1-motorola-fixes, codex/v73-2-tps-fire-drag, codex/v74-aurora-offline-royale, codex/v74-1-weapons-ik-awm, codex/v75-br-flow-animations, codex/v75-1-real-match-progression, codex/v75-2-motorola-recovery, codex/v75-3-battle-royale-improvements, codex/v75-4-aim-animation-recovery, codex/v75-5-aurora-lobby-combat-ui, codex/v75-6-puerto-aurora-3d-district, codex/v75-7-terrain-camera-audio-repair, codex/v75-8-world-navigation-stabilization, codex/v75-9-camera-obstruction-polish, codex/v75-10-materials-locomotion-pass, codex/v75-11-aurora-gait-coastal-detail, codex/v75-11-landing-stability-fix, codex/v75-12-per-scope-mobile-settings, codex/v75-13-aurora-deployable-cover, codex/v75-14-mobile-freefall-crash-recovery, codex/v75-15-aircraft-jump-transition-isolation, codex/v75-16-aircraft-startup-isolation, codex/v75-17-mobile-freefall-terrain-protection, codex/v75-18-parachute-transition-isolation, codex/v75-19-prewarmed-canopy-native-trace, codex/godot-canopy-physics-audit, codex/godot-flight-blackbox-diagnostics, codex/godot-shared-scene-crash-audit, codex/v75-20-training-freefall-crash-isolation]
    paths:
      - 'native-godot/**'
      - 'docs/V71_REAL_BATTLE_ROYALE_MASTER_PLAN.md'
      - '.github/workflows/native-godot-foundation.yml'
  workflow_dispatch:

jobs:
  canopy-source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify automatic canopy handoff cannot rebuild HUD inside physics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('native-godot/scripts/match/airdrop_sequence.gd').read_text()
          physics=s.split('func _physics_process(delta: float) -> void:',1)[1].split('\n\nfunc jump_from_aircraft()',1)[0]
          assert '_queue_auto_parachute()' in physics
          assert 'deploy_parachute()' not in physics
          assert 'hud.set_air_stage' not in physics
          assert 'call_deferred("_commit_parachute")' in s
          assert 'phase="parachute_pending"' in s
          p=Path('native-godot/scripts/player/third_person_operator.gd').read_text()
          assert 'skip_canopy_animation(canopy_diagnostic_mode)' in p
          assert 'skip_canopy_mesh(canopy_diagnostic_mode)' in p
          assert Path('native-godot/scripts/qa/canopy_auto_handoff_qa.gd').is_file()
          assert Path('native-godot/scripts/qa/canopy_diagnostic_modes_qa.gd').is_file()
          assert Path('native-godot/scripts/qa/capture_canopy_render_qa.gd').is_file()
          logs=Path('native-godot/scripts/match/flight_diagnostics.gd').read_text()
          assert 'MAX_EVENTS: int=48' in logs
          assert 'PREVIOUS_PATH:' in logs
          assert 'physics_frames' in logs and 'animation_clip' in logs
          operator=p
          assert 'canopy_first_frame_rendered' in operator
          front=Path('native-godot/scripts/ui/aurora_frontend.gd').read_text()
          assert 'FlightBlackBoxText' in front
          assert Path('native-godot/scripts/qa/flight_blackbox_qa.gd').is_file()
          shared=Path('native-godot/scripts/main.gd').read_text()
          front=Path('native-godot/scripts/ui/aurora_frontend.gd').read_text()
          navigation=Path('native-godot/scripts/ai/aurora_navigation.gd').read_text()
          assert 'terrain_build_begin' in shared and 'main_scene_ready' in shared
          assert 'frontend_scene_enter_tree_before' in front
          assert 'training_entered' in front
          assert 'navigation_first_batch_before' in navigation
          assert 'without_navigation_graph()' in navigation
          assert Path('native-godot/scripts/qa/shared_scene_startup_qa.gd').is_file()
          nav=Path('native-godot/scripts/ai/aurora_navigation.gd').read_text()
          flight=Path('native-godot/scripts/player/third_person_operator.gd').read_text()
          assert 'NODE_BATCH_SIZE: int=12' in nav and 'navigation_batch_after' in nav
          assert 'freefall_tick_after_move_and_slide' in flight
          assert 'freefall_tick_first_render_completed' in flight
          assert Path('native-godot/scripts/qa/v7520_navigation_batch_qa.gd').is_file()
          assert Path('native-godot/scripts/qa/v7520_freefall_first_tick_qa.gd').is_file()
          print('V7520_SOURCE_PREFLIGHT PASS dual Training/freefall isolation, safe navigation batching and native A/B mode coverage')
          PY
  flight-blackbox-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2 editor without Blender
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/godot-blackbox.zip
          unzip -q /tmp/godot-blackbox.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Execute actual GDScript durable black-box test
        run: |
          mkdir -p native-godot/out/qa
          export XDG_DATA_HOME="$(mktemp -d)" GODOT_SILENCE_ROOT_WARNING=1
          godot --headless --path native-godot --script res://scripts/qa/flight_blackbox_qa.gd > native-godot/out/qa/flight_blackbox_qa.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:' native-godot/out/qa/flight_blackbox_qa.log; then
            cat native-godot/out/qa/flight_blackbox_qa.log
            exit 1
          fi
          grep -F 'FLIGHT_BLACKBOX PASS' native-godot/out/qa/flight_blackbox_qa.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AURORA-FLIGHT-BLACKBOX-QA
          path: native-godot/out/qa/flight_blackbox_qa.log

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2 editor
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version
      - name: Prepare visual test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
          bash native-godot/tools/prepare_assets.sh /tmp/aurora-operator
      - name: Run complete native QA with imported operator and weapons
        run: bash native-godot/tools/run_qa.sh
      - name: Render first real animated canopy after automatic physics trigger
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/tmp/aurora-audit-gl.log
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_canopy_render_qa.gd > native-godot/out/qa/canopy-render.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:' native-godot/out/qa/canopy-render.log; then exit 1; fi
          grep -F 'CANOPY_OPENGL_RENDER PASS' native-godot/out/qa/canopy-render.log
          test -s native-godot/out/audit-first-canopy-opengl.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GODOT-CANOPY-PHYSICS-AUDIT-LOGS
          path: |
            native-godot/out/qa
            native-godot/out/audit-first-canopy-opengl.png
