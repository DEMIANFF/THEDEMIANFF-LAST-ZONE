name: Aurora V3 integration - Godot QA and visual evidence
on:
  push:
    branches: [codex/v75-118-aurora-v3-resource-integration]
    paths:
      - 'native-godot/**'
      - '.github/workflows/aurora-v3-integration.yml'
      - 'docs/aurora-v3/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aurora-v3-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  godot-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy python3-pil xvfb libgl1-mesa-dri > /tmp/aurora-tools.log
      - name: Prepare existing licensed runtime assets
        run: bash native-godot/tools/prepare_assets.sh /tmp/aurora-operator
      - name: Install the same Godot version as the tested base
        run: |
          curl -fL --retry 3 --retry-delay 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/aurora-godot.zip
          unzip -q /tmp/aurora-godot.zip -d /tmp
          sudo install -m 0755 /tmp/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version
      - name: Import GLBs and run all native regressions
        run: bash native-godot/tools/run_qa.sh
      - name: Render real weapon actions and preserved lobby
        run: |
          mkdir -p native-godot/out/aurora-v3-weapons
          export XDG_DATA_HOME="$(mktemp -d)"
          xvfb-run -a -s "-screen 0 960x640x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --resolution 960x640 --script res://scripts/qa/capture_aurora_v3_weapons.gd > native-godot/out/qa/aurora-v3-capture.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:' native-godot/out/qa/aurora-v3-capture.log; then exit 1; fi
          grep -F 'AURORA_V3_WEAPON_CAPTURE PASS' native-godot/out/qa/aurora-v3-capture.log
          xvfb-run -a -s "-screen 0 1280x720x24" godot --audio-driver Dummy --path native-godot --rendering-method gl_compatibility --script res://scripts/qa/capture_frontend_preview.gd > native-godot/out/qa/aurora-v3-lobby-capture.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR:' native-godot/out/qa/aurora-v3-lobby-capture.log; then exit 1; fi
      - name: Review contact sheet
        run: python3 native-godot/tools/weapon_contact_sheet.py
      - name: Confirm this workflow produced no APK
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assert not list(Path("native-godot/out").rglob("*.apk")), "Unexpected intermediate APK"
          print("NO_INTERMEDIATE_APK PASS")
          PY
      - name: Preserve logs and actual Godot captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AURORA-V3-INTEGRATION-EVIDENCE-${{ github.sha }}
          path: |
            native-godot/out/qa/
            native-godot/out/aurora-v3-weapons/
            native-godot/out/*loading.png
            native-godot/out/*login.png
            native-godot/out/*lobby.png
          if-no-files-found: error
          retention-days: 30
